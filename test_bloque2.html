<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>Test Bloque 2 · Domótica 2MT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1d2320; --muted:#5d6862; --line:#d9e0d4;
  --green:#4e8a1e; --green-soft:#e6f2da; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#eef2ea; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
  --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
    --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--green);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.nq{font-weight:700;color:var(--ink);border-color:var(--green)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.card.resume{border-left:5px solid var(--yellow);background:var(--yellow-soft)}
.pt{display:inline-block;min-width:1.5em;height:1.5em;line-height:calc(1.5em - 3px);padding:0 .12em;margin:0 .06em;border-radius:999px;background:#FFDD40;color:#111;border:1.5px solid #111;font-weight:700;font-size:.82em;text-align:center;vertical-align:.1em;font-style:normal}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.tw{overflow-x:auto;margin:0 0 6px}
.tt{border-collapse:collapse;margin:0 auto;font-size:15px;text-align:center}
.tt th,.tt td{border:1.5px solid var(--line);padding:6px 10px;min-width:44px}
.tt th{background:var(--green-soft);font-weight:700}
.tt td{font-weight:700;font-size:17px}
.tt td.qq{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow)}
.cgrp{margin:0 0 10px}
.cgrp h3{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.cbtns{display:flex;gap:8px;margin:0 0 8px}
.cbtns button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.jump{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:8px;margin:0 0 12px}
.jump>.go{padding:8px 14px;font-size:15px}
.jump>.go.ghost[aria-expanded=true]{border-color:var(--green);background:var(--green-soft)}
.qgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.qgrid[hidden]{display:none}
.qgrid button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:7px 0;cursor:pointer}
.qgrid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qgrid button.cur{outline:3px solid var(--green);outline-offset:1px}
.qgrid .leg{grid-column:1/-1;font-size:13px;color:var(--muted);margin:2px 0 0}
.qgrid .go.fin{grid-column:1/-1;margin-top:4px;color:var(--on-green);background:var(--green);border:none;padding:10px}
@media (max-width:480px){.jump{gap:6px}.jump .tx{display:none}.jump>.go{padding:8px 10px;font-size:14px}}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}

/* ---------- mapa de preguntas y marcador ---------- */
.qmap,.qbar,.qsheet{display:none}
.qmap h2{margin:0 0 8px;font-size:15px}
.qblk{margin:0 0 8px}.qblk>span{display:block;font-size:11px;color:var(--muted);margin:0 0 3px}
.qblk .g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qblk button{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:6px;padding:5px 0;cursor:pointer}
.qblk button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qblk button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qblk button.cur{outline:3px solid var(--green);outline-offset:1px}
.qmap .leg{font-size:11px;color:var(--muted);margin:6px 0 0}
.qmap .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line);margin:0 3px 0 6px;vertical-align:-1px}
.qmap .leg i:first-child{margin-left:0}
.qmap .leg i.ok{background:var(--ok-soft);border-color:var(--ok)}.qmap .leg i.ko{background:var(--red-soft);border-color:var(--red)}
.sc{font-size:15px;margin:0 0 6px}.sc b{font-size:22px;margin-right:4px}.sc.ok b{color:var(--ok)}.sc.ko b{color:var(--red)}
.sc.nota{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.sc small{display:block;color:var(--muted);font-size:11px}
.qmap .fin,.qsheet .fin{width:100%;margin-top:8px;font-size:14px;padding:8px}
@media (min-width:1240px){
  body.inq .qmap{display:block;position:fixed;top:76px;max-height:calc(100vh - 92px);overflow:auto;width:min(230px,calc((100vw - 860px)/2 - 30px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
  body.inq .qmap.l{right:calc(50% + 444px)} body.inq .qmap.r{left:calc(50% + 444px)}
}
@media (max-width:1239px){
  body.inq .qbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));cursor:pointer;box-shadow:0 -4px 12px rgba(0,0,0,.15)}
  .qbar .segs{display:flex;gap:1px;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
  .qbar .segs i{flex:1;background:var(--btn)}.qbar .segs i.ok{background:var(--ok)}.qbar .segs i.ko{background:var(--red)}.qbar .segs i.cur{box-shadow:inset 0 0 0 2px var(--ink)}
  .qbar .tx{font-size:14px;font-weight:700;margin-top:4px;display:flex;gap:6px;align-items:center}.qbar .tx .ok{color:var(--ok)}.qbar .tx .ko{color:var(--red)}.qbar .more{margin-left:auto;color:var(--muted);font-weight:400}
  body.inq .qsheet{display:block;position:fixed;left:0;right:0;bottom:46px;max-height:62vh;overflow:auto;z-index:14;background:var(--card);border-top:1px solid var(--line);padding:10px 12px 14px;box-shadow:0 -6px 16px rgba(0,0,0,.25)}
  body.inq .qsheet[hidden]{display:none}
  .qsheet .qblk .g{grid-template-columns:repeat(10,1fr)}
  .qsheet .qblk button{padding:8px 0}
  body.inq main{padding-bottom:110px}
}
</style>
</head>

<script>
const DATA = [{"n": 1, "ans": "b", "tema": "T2", "t": "T2 · Introducción (idea clave)", "dif": "M", "tipo": "LOGO", "q": "¿Qué es un autómata programable (PLC)?", "ok": "Un aparato que lee las entradas, ejecuta un programa y manda en las salidas", "d": ["Un relé que cambia de estado con cada pulsación", "Un sensor que detecta presencia y da 230 V", "Una fuente de alimentación de 12 Vcc"], "j": "Hace el trabajo de los relés auxiliares, temporizadores y telerruptores del cuadro, pero con un programa en lugar de con cables.", "img": null, "cap": "", "cat": ["logo"]}, {"n": 2, "ans": "c", "tema": "T2", "t": "T2 · 1.1 (pista)", "dif": "M", "tipo": "LOGO", "q": "En el aula usamos el LOGO! 8 12/24RCE. ¿Qué quiere decir «12/24RCE»?", "ok": "Se alimenta a 12 o 24 Vcc, salidas a relé, con reloj y con Ethernet", "d": ["Entradas de 12 V y salidas de 24 V, con Ethernet", "12 entradas y 24 salidas a relé", "Se alimenta a 230 V y tiene 12 entradas y 24 salidas"], "j": "12/24 = alimentación a 12 o 24 Vcc · R = salidas a relé · C = con reloj (clock) · E = con Ethernet.", "img": "t2_logo.png", "cap": "Tema 2, figura 2: partes del LOGO! 8 12/24RCE.", "cat": ["esquemas", "logo"]}, {"n": 3, "ans": "c", "tema": "T2", "t": "T2 · 1.1 (pista)", "dif": "D", "tipo": "SEG", "q": "Te encuentras en el panel un LOGO! 12/24RCE. ¿Qué pasa si le metes 230 V en una entrada?", "ok": "Se quema: sus entradas son de 12/24 Vcc", "d": ["Nada: las entradas aguantan hasta 230 V", "La entrada se pone a 1 y funciona igual", "Salta el magnetotérmico de continua y no se estropea nada"], "j": "Existe otro modelo, el 230RCE, con entradas de 230 V. Mira siempre la pegatina antes de cablear: los 230 V solo pasan por los contactos de las salidas.", "img": null, "cap": "", "cat": ["cableado", "seguridad"]}, {"n": 4, "ans": "d", "tema": "T2", "t": "T2 · 1.2", "dif": "M", "tipo": "LOGO", "q": "¿Cuántas entradas y salidas tiene el LOGO! 8 12/24RCE, sin módulos de ampliación?", "ok": "8 entradas (I1…I8) y 4 salidas a relé (Q1…Q4)", "d": ["4 entradas y 8 salidas a relé", "8 entradas y 8 salidas a relé", "12 entradas y 4 salidas a transistor"], "j": "Arriba, los tornillos L+, M e I1…I8; abajo, los cuatro relés de salida, cada uno con sus tornillos 1 y 2.", "img": "t2_logo.png", "cap": "Tema 2, figura 2: partes del LOGO! 8 12/24RCE.", "cat": ["esquemas", "logo"]}, {"n": 5, "ans": "c", "tema": "T2", "t": "T2 · 1.2 (datos)", "dif": "D", "tipo": "LOGO", "q": "¿Qué tensión tiene que llegar a una entrada para que el LOGO! lea un 1?", "ok": "Más de 8 V; con menos de 5 V lee 0", "d": ["Cualquier tensión por encima de 0 V", "Exactamente 12 V, ni más ni menos", "Más de 1 V; con menos lee 0"], "j": "Por eso una tensión pequeña que sale a veces sin accionar el sensor (una tensión «fantasma») cuenta como 0.", "img": null, "cap": "", "cat": ["logo", "medidas"]}, {"n": 6, "ans": "a", "tema": "T2", "t": "T2 · 1.2 (idea clave)", "dif": "M", "tipo": "LOGO", "q": "El LOGO! se alimenta a 12 V. ¿Cómo puede encender una bombilla de 230 V?", "ok": "Sus salidas son contactos secos de relé: la tensión de la bombilla pasa por el contacto", "d": ["El LOGO! sube la tensión de 12 V a 230 V", "La bombilla se conecta entre L+ y M", "No puede: siempre hace falta un contactor"], "j": "Es como el contacto de un relé del Tema 1: no tiene tensión propia. La tensión de la bombilla no pasa por la electrónica del LOGO!.", "img": null, "cap": "", "cat": ["logo", "salidas"]}, {"n": 7, "ans": "b", "tema": "T2", "t": "T2 · 1.3", "dif": "M", "tipo": "LOGO", "q": "Cargas un programa nuevo en el LOGO!. ¿Qué pasa?", "ok": "Pasa a STOP y, al terminar, hay que ponerlo en RUN", "d": ["Se queda en RUN y el programa nuevo empieza solo", "Se apaga y hay que quitarle la tensión", "Pasa a RUN, pero las salidas se quedan bloqueadas"], "j": "En STOP no ejecuta tu programa y las salidas están apagadas. LOGO!Soft pregunta al final si lo pones en RUN.", "img": null, "cap": "", "cat": ["soft"]}, {"n": 8, "ans": "b", "tema": "T2", "t": "T2 · 1.4", "dif": "M", "tipo": "LOGO", "q": "¿En qué orden da cada vuelta el ciclo de scan?", "ok": "Lee las entradas → ejecuta el programa → escribe las salidas", "d": ["Escribe las salidas → lee las entradas → ejecuta el programa", "Ejecuta el programa → lee las entradas → escribe las salidas", "Lee las entradas → escribe las salidas → ejecuta el programa"], "j": "Primero hace una «foto» de las entradas, recorre el programa con esa foto y, al final, pasa los resultados a los relés, todos a la vez.", "img": null, "cap": "", "cat": ["scan"]}, {"n": 9, "ans": "d", "tema": "T2", "t": "T2 · 1.4 (idea clave)", "dif": "D", "tipo": "LOGO", "q": "Pulsas un pulsador justo cuando el LOGO! está ejecutando el programa (paso 2 del ciclo). ¿Cuándo lo ve?", "ok": "En la vuelta siguiente: durante una vuelta usa la «foto» de las entradas", "d": ["Al instante, en mitad de la vuelta", "Nunca: hay que mantenerlo pulsado un segundo", "Cuando el LOGO! pasa a STOP"], "j": "Una vuelta dura unos milisegundos, así que para nosotros es instantáneo. El programa no ve el pulsador: ve la foto del pulsador.", "img": null, "cap": "", "cat": ["scan"]}, {"n": 10, "ans": "a", "tema": "T2", "t": "T2 · 1.5", "dif": "D", "tipo": "LOGO", "q": "Un programa escribe Q1 dos veces: la primera línea mandada por I1 y la segunda por I2. Pulsas I1 y dejas I2 suelto. ¿Qué sale?", "ok": "Q1 = 0: solo vale la última línea que escribe Q1", "d": ["Q1 = 1: basta con que una de las dos lo pida", "Q1 se enciende y se apaga muy deprisa", "El LOGO! da error y pasa a STOP"], "j": "La línea 1 apunta Q1 = 1, pero la línea 2 lo borra y apunta Q1 = 0. En el paso 3 sale lo último. LOGO!Soft ya no te deja poner una salida dos veces.", "img": null, "cap": "", "cat": ["scan"]}, {"n": 11, "ans": "b", "tema": "T2", "t": "T2 · 1.5 (¿por qué?)", "dif": "M", "tipo": "PROG", "q": "La bombilla E1 se tiene que encender desde dos sitios distintos. ¿Cómo se programa?", "ok": "Se juntan las dos condiciones en una OR y Q1 se escribe una sola vez", "d": ["Se pone Q1 dos veces, una por cada sitio", "Se juntan las dos condiciones en una AND", "Cada sitio escribe su propia Q1 en una marca distinta"], "j": "Lo que lee (I, Q, M…) se puede repetir; lo que escribe (cada salida Q), no. Por eso las órdenes se juntan antes con una OR.", "img": null, "cap": "", "cat": ["puertas", "scan"]}, {"n": 12, "ans": "c", "tema": "T2", "t": "T2 · 1.7", "dif": "M", "tipo": "PROG", "q": "¿Qué dos lenguajes de programación usa el LOGO!?", "ok": "KOP (contactos) y FUP (bloques)", "d": ["Grafcet y texto estructurado", "Lista de instrucciones y KOP", "FUP y texto estructurado"], "j": "KOP parece un esquema eléctrico, con contactos y bobinas; FUP son cajas (puertas) unidas con líneas. En la P4 programamos solo en FUP.", "img": null, "cap": "", "cat": ["soft"]}, {"n": 13, "ans": "a", "tema": "T2", "t": "T2 · 3.1", "dif": "M", "tipo": "PROG", "q": "En LOGO!Soft, ¿qué encuentras con el botón GF?", "ok": "Las funciones básicas: AND, OR, NOT…", "d": ["Las funciones especiales: temporizadores, relés…", "Las constantes: entradas I, salidas Q, marcas M…", "La simulación del programa"], "j": "GF viene del alemán Grundfunktionen (funciones básicas); SF, de Sonderfunktionen (funciones especiales); Co son las constantes.", "img": null, "cap": "", "cat": ["soft"]}, {"n": 14, "ans": "a", "tema": "T2", "t": "T2 · 2.1", "dif": "M", "tipo": "CAB", "q": "¿Cómo se alimenta el LOGO! en el panel?", "ok": "L+ al +12 V y M al 0 V, después del magnetotérmico de continua Q2", "d": ["L+ a la fase y M al neutro, después de Q1", "L+ al 0 V y M al +12 V", "Por cualquiera de las entradas I"], "j": "L+ es el positivo y M el negativo (0 V). Al dar tensión se enciende la pantalla.", "img": null, "cap": "", "cat": ["cableado"]}, {"n": 15, "ans": "c", "tema": "T2", "t": "T2 · 2.1 (en el taller)", "dif": "M", "tipo": "MED", "q": "Mides con el polímetro en V⎓ entre L+ y M y sale −12 V. ¿Qué pasa?", "ok": "Están cruzados los cables (o las puntas del polímetro)", "d": ["Es lo normal en continua", "La fuente está dando alterna", "El LOGO! está en STOP"], "j": "En continua el signo dice qué punta está en el positivo. Roja en L+, negra en M: tiene que salir unos +12 V.", "img": null, "cap": "", "cat": ["cableado", "medidas"]}, {"n": 16, "ans": "c", "tema": "T2", "t": "T2 · 2.4", "dif": "M", "tipo": "CAB", "q": "Un paro con contacto NC va a una entrada (lógica negativa). ¿Cómo está la entrada?", "ok": "A 1 en reposo, y pasa a 0 al pulsar", "d": ["A 0 en reposo, y pasa a 1 al pulsar", "Siempre a 0", "Siempre a 1"], "j": "El NC deja pasar el +12 V mientras no se pulsa. Al pulsarlo se abre y la entrada cae a 0.", "img": null, "cap": "", "cat": ["logica"]}, {"n": 17, "ans": "b", "tema": "T2", "t": "T2 · 2.4", "dif": "D", "tipo": "SEG", "q": "¿Por qué los paros y las seguridades se cablean con contactos NC (lógica negativa)?", "ok": "Si se corta un cable, la entrada cae a 0 y la instalación se para", "d": ["Porque gastan menos corriente", "Porque el LOGO! solo lee contactos NC", "Porque con un NA la entrada se quemaría"], "j": "Con un NA, un cable suelto deja la instalación sin paro y no te enteras. Con un NC, un cable suelto hace lo mismo que pulsar el paro.", "img": null, "cap": "", "cat": ["logica", "seguridad"]}, {"n": 18, "ans": "d", "tema": "T2", "t": "T2 · 2.4 y 3.2 (¡OJO!)", "dif": "D", "tipo": "PROG", "q": "El paro I2 es un pulsador NC. ¿Cómo se pone I2 en el programa?", "ok": "Sin negar en FUP, y con contacto abierto en KOP", "d": ["Negado en FUP, y con contacto cerrado en KOP", "Negado en FUP, y con contacto abierto en KOP", "No se pone: el propio cable ya para la instalación"], "j": "La entrada está a 1 mientras no se pulsa: entra tal cual a la AND. No confundas el pulsador NC con el contacto NC del programa.", "img": "t2_negativa.png", "cap": "Tema 2, figura 9: marcha-paro con el paro I2 en lógica negativa (NC).", "cat": ["esquemas", "logica", "memoria"]}, {"n": 19, "ans": "a", "tema": "T2", "t": "T2 · 2.5", "dif": "M", "tipo": "CAB", "q": "Un sensor PNP de 3 hilos detecta. ¿Qué hace su cable negro (BK)?", "ok": "Da el + (positivo)", "d": ["Se une con el 0 V", "Da 230 V", "Se queda sin tensión, como un contacto abierto"], "j": "Truco: PNP → sale Positivo por el negro. Por eso va directo a una entrada del LOGO!, que se pone a 1 cuando le llega el +.", "img": "t2_pnp.png", "cap": "Tema 2, figura 10: sensor PNP y sensor NPN: dónde se conecta la carga.", "cat": ["cableado", "esquemas", "logica"]}, {"n": 20, "ans": "b", "tema": "T2", "t": "T2 · 2.5", "dif": "D", "tipo": "CAB", "q": "¿Puedes conectar un sensor NPN directamente a una entrada del LOGO! 12/24?", "ok": "No: al detectar une el negro con el 0 V y a la entrada nunca le llega el +", "d": ["Sí, igual que un PNP", "Sí, si cambias el marrón por el azul", "Solo si lo alimentas a 24 V"], "j": "Con un NPN el LOGO! no se entera. Si solo tienes uno NPN, pon un relé de 24 Vcc: su bobina entre el + y el negro, y su contacto lleva el +12 V a la entrada.", "img": "t2_pnp.png", "cap": "Tema 2, figura 10: sensor PNP y sensor NPN: dónde se conecta la carga.", "cat": ["cableado", "esquemas", "logica"]}, {"n": 21, "ans": "b", "tema": "T2", "t": "T2 · 2.6", "dif": "M", "tipo": "CAB", "q": "¿Cómo se cablea un actuador de 230 V en una salida del LOGO!?", "ok": "La fase al tornillo 1; del 2 al actuador; el otro tornillo del actuador al N", "d": ["El neutro al tornillo 1 y del 2 a la fase", "El +12 V al tornillo 1 y del 2 al actuador", "La fase al 2, el neutro al 1 y el actuador entre los dos"], "j": "Cada salida es un contacto NA entre 1 y 2. Cuando el programa pone la salida a 1, se cierra y la fase llega al actuador.", "img": "t2_salidas.png", "cap": "Tema 2, figura 11: actuadores de 230 V en las salidas del LOGO!.", "cat": ["cableado", "esquemas", "salidas"]}, {"n": 22, "ans": "c", "tema": "T2", "t": "T2 · 2.6 (¡OJO!)", "dif": "M", "tipo": "SEG", "q": "Cada relé de salida del LOGO! tiene un solo contacto NA. ¿Qué consecuencia tiene en una persiana?", "ok": "No hay NC para enclavar con cables: el enclavamiento se hace en el programa", "d": ["Hay que poner siempre dos LOGO!", "La persiana solo puede subir", "El motor tiene que ir a 12 V"], "j": "Con relés del Tema 1 usabas un NC del relé contrario. Aquí no lo hay: lo hace el programa.", "img": null, "cap": "", "cat": ["persianas", "salidas", "seguridad"]}, {"n": 23, "ans": "a", "tema": "T2", "t": "T2 · 3.2", "dif": "M", "tipo": "TAB", "q": "Mira la figura. I1 = 1 e I2 = 0. ¿Qué dan la AND, la OR y la XOR?", "ok": "AND = 0 · OR = 1 · XOR = 1", "d": ["AND = 1 · OR = 1 · XOR = 0", "AND = 0 · OR = 1 · XOR = 0", "AND = 0 · OR = 0 · XOR = 1"], "j": "AND solo da 1 si todas son 1. OR da 1 si alguna es 1. XOR da 1 si las entradas son distintas.", "img": "t2_puertas.png", "cap": "Tema 2, figura 15: AND, OR, NOT y XOR en FUP y en KOP.", "tab": {"h": ["I1", "I2", "AND", "OR", "XOR"], "r": [["1", "0", "?", "?", "?"]]}, "cat": ["esquemas", "puertas", "tablas"]}, {"n": 24, "ans": "a", "tema": "T2", "t": "T2 · 3.2", "dif": "M", "tipo": "PROG", "q": "En KOP no hay puertas. ¿Cómo se hace una OR?", "ok": "Con contactos en paralelo", "d": ["Con contactos en serie", "Con un contacto cerrado", "Con una bobina invertida"], "j": "Igual que en el Tema 1: el «O» son contactos en paralelo y el «Y», en serie.", "img": "t2_puertas.png", "cap": "Tema 2, figura 15: AND, OR, NOT y XOR en FUP y en KOP.", "cat": ["esquemas", "puertas"]}, {"n": 25, "ans": "b", "tema": "T2", "t": "T2 · 3.3", "dif": "M", "tipo": "PROG", "q": "¿Cuánto dura el impulso que da un AND (flanco)?", "ok": "Una sola vuelta del ciclo de scan: unos milisegundos", "d": ["Mientras sigas pulsando", "Un segundo justo", "El tiempo T que le pongas"], "j": "Aunque sigas pulsando, la salida vuelve a 0 en la vuelta siguiente. Solo vale 1 en el momento en que la entrada pasa de 0 a 1.", "img": "t2_flancos.png", "cap": "Tema 2, figura 16: flanco positivo al pulsar y flanco negativo al soltar.", "cat": ["esquemas", "flancos"]}, {"n": 26, "ans": "a", "tema": "T2", "t": "T2 · 3.3", "dif": "M", "tipo": "PROG", "q": "Quieres que algo pase en el momento de soltar un pulsador. ¿Qué bloque usas?", "ok": "NAND (flanco)", "d": ["AND (flanco)", "Una OR con una sola entrada", "Un relé de impulsos"], "j": "NAND (flanco) da un impulso cuando su entrada pasa de 1 a 0 (flanco negativo). AND (flanco), cuando pasa de 0 a 1.", "img": null, "cap": "", "cat": ["flancos"]}, {"n": 27, "ans": "b", "tema": "T2", "t": "T2 · 3.3 (¡OJO!)", "dif": "D", "tipo": "PROG", "q": "Pones la salida de un AND (flanco) directamente en Q1, que lleva una bombilla. ¿Qué ves al pulsar?", "ok": "Nada: el impulso es tan corto que la bombilla no llega a encenderse", "d": ["La bombilla se enciende mientras pulsas", "La bombilla se enciende un segundo", "La bombilla se queda encendida hasta el siguiente impulso"], "j": "El flanco se usa para mandar sobre otro bloque (relé autoenclavador, de impulsos, contador…). Si quieres un impulso que se vea, usa un temporizador.", "img": null, "cap": "", "cat": ["flancos"]}, {"n": 28, "ans": "c", "tema": "T2", "t": "T2 · 3.4", "dif": "M", "tipo": "TAB", "q": "Relé autoenclavador con prioridad RS. Llegan a la vez S = 1 y R = 1. ¿Cómo queda la salida?", "ok": "Q = 0: gana el reset", "d": ["Q = 1: gana el set", "Se queda como estaba", "Cambia de estado"], "j": "Con RS gana R, que es lo seguro (si se pulsan a la vez marcha y paro, gana el paro). Con SR ganaría S.", "img": "t2_rs.png", "cap": "Tema 2, figura 19: cronograma de un set-reset con prioridad al reset (RS).", "tab": {"h": ["S", "R", "Par", "Q"], "r": [["1", "1", "RS", "?"]]}, "cat": ["esquemas", "memoria", "tablas"]}, {"n": 29, "ans": "a", "tema": "T2", "t": "T2 · 3.4", "dif": "M", "tipo": "TAB", "q": "Relé autoenclavador. Q estaba a 1 y ahora S = 0 y R = 0. ¿Cómo queda?", "ok": "Q = 1: no cambia, recuerda lo último", "d": ["Q = 0", "Q cambia de estado", "Depende de la prioridad"], "j": "Con S y R a 0 el bloque guarda lo último que pasó: es la memoria. Por eso basta un impulso para encender y otro para apagar.", "img": "t2_rs.png", "cap": "Tema 2, figura 19: cronograma de un set-reset con prioridad al reset (RS).", "tab": {"h": ["Q antes", "S", "R", "Q"], "r": [["1", "0", "0", "?"]]}, "cat": ["esquemas", "memoria", "tablas"]}, {"n": 30, "ans": "b", "tema": "T2", "t": "T2 · 3.4", "dif": "M", "tipo": "PROG", "q": "En los parámetros del relé autoenclavador, ¿qué quiere decir Rem = on?", "ok": "Que recuerda su estado si se va la luz", "d": ["Que al volver la luz arranca a 0", "Que gana el reset", "Que la salida se apaga sola al cabo de un tiempo"], "j": "Rem es la remanencia. Con Rem = off, al volver la luz el bloque arranca a 0.", "img": null, "cap": "", "cat": ["memoria"]}, {"n": 31, "ans": "c", "tema": "T2", "t": "T2 · 3.4 (idea clave)", "dif": "D", "tipo": "SEG", "q": "Tras un corte de luz, ¿qué remanencia conviene a una persiana y a una alarma de inundación?", "ok": "Persiana Rem = off (arranca parada) y alarma Rem = on (sigue memorizada)", "d": ["Persiana Rem = on y alarma Rem = off", "Las dos Rem = on", "Las dos Rem = off"], "j": "Una persiana o un motor mejor que arranquen parados. Una alarma de agua no se puede olvidar porque se haya ido la luz.", "img": null, "cap": "", "cat": ["memoria", "persianas", "seguridad"]}, {"n": 32, "ans": "d", "tema": "T2", "t": "T2 · 3.5", "dif": "M", "tipo": "SEG", "q": "Enclavamiento de la persiana en el programa: ¿qué lleva en serie cada salida?", "ok": "La salida contraria negada: sube si ▲ Y NO baja; baja si ▼ Y NO sube", "d": ["La misma salida, para que se quede encendida", "Un retardo a la conexión", "La otra tecla sin negar"], "j": "Así, mientras una salida está a 1, la otra no puede activarse. En las persianas, siempre.", "img": "t2_encl.png", "cap": "Tema 2, figura 23: enclavamiento de la persiana en FUP y en KOP.", "cat": ["esquemas", "persianas", "seguridad"]}, {"n": 33, "ans": "d", "tema": "T2", "t": "T2 · 3.6", "dif": "M", "tipo": "PROG", "q": "Luz de pasillo con tres pulsadores y un relé de impulsos. ¿Dónde van los pulsadores?", "ok": "Los tres en una OR que va a Trg", "d": ["Uno a Trg, otro a S y otro a R", "Los tres a S", "Los tres en una AND que va a Trg"], "j": "Cada impulso en Trg cambia la salida, venga del pulsador que venga. S y R son para encender o apagar a la fuerza.", "img": null, "cap": "", "cat": ["impulsos"]}, {"n": 34, "ans": "b", "tema": "T2", "t": "T2 · 3.7", "dif": "M", "tipo": "TIEM", "q": "Retardo a la conexión con T = 10 s. Trg está a 1 durante 6 s y vuelve a 0. ¿Qué hace la salida?", "ok": "No llega a encenderse", "d": ["Se enciende a los 10 s", "Se enciende al momento y se apaga a los 6 s", "Se enciende a los 6 s"], "j": "Si Trg está a 1 menos de T, Q no se activa. La próxima vez empieza a contar desde cero.", "img": "t2_ton.png", "cap": "Tema 2, figura 26: retardo a la conexión.", "cat": ["esquemas", "tiempos"]}, {"n": 35, "ans": "d", "tema": "T2", "t": "T2 · 3.7", "dif": "M", "tipo": "TIEM", "q": "Retardo a la conexión con T = 10 s. Trg se queda a 1 un minuto y luego vuelve a 0. ¿Qué hace la salida?", "ok": "Se enciende a los 10 s y se apaga en cuanto Trg vuelve a 0", "d": ["Se enciende al momento y se apaga 10 s después de que Trg vuelva a 0", "Se enciende a los 10 s y se apaga sola 10 s más tarde", "Se enciende a los 10 s y se queda encendida"], "j": "El de conexión tarda en encender, pero apaga al momento: Q = 1 solo mientras Trg siga a 1.", "img": "t2_ton.png", "cap": "Tema 2, figura 26: retardo a la conexión.", "cat": ["esquemas", "tiempos"]}, {"n": 36, "ans": "a", "tema": "T2", "t": "T2 · 3.7 (¡OJO!)", "dif": "M", "tipo": "TIEM", "q": "Retardo a la desconexión: ¿cuándo empieza a contar el tiempo T?", "ok": "Cuando Trg vuelve a 0", "d": ["Cuando Trg pasa a 1", "Cuando llega un impulso a R", "Cuando se carga el programa"], "j": "El de conexión cuenta mientras Trg = 1; el de desconexión, cuando Trg vuelve a 0. Es el error más habitual al elegir el bloque.", "img": "t2_toff.png", "cap": "Tema 2, figura 27: retardo a la desconexión.", "cat": ["esquemas", "tiempos"]}, {"n": 37, "ans": "c", "tema": "T2", "t": "T2 · 3.7", "dif": "D", "tipo": "TIEM", "q": "Retardo a la desconexión. Trg ha vuelto a 0 y, antes de que pase T, vuelve a 1. ¿Qué pasa?", "ok": "La cuenta vuelve a empezar y Q no llega a apagarse", "d": ["Q se apaga igualmente al acabar T", "Q se apaga al momento", "Q se apaga y se vuelve a encender"], "j": "Por eso, con un detector en Trg, la luz no se apaga mientras haya alguien: cada vez que te ve, la cuenta vuelve a empezar.", "img": "t2_toff.png", "cap": "Tema 2, figura 27: retardo a la desconexión.", "cat": ["esquemas", "tiempos"]}, {"n": 38, "ans": "a", "tema": "T2", "t": "T2 · 3.7 (parámetros)", "dif": "D", "tipo": "TIEM", "q": "Debajo de un temporizador se lee, en verde, «03:00m+». ¿Qué quiere decir?", "ok": "3 minutos, y el tiempo se puede cambiar desde la pantalla del LOGO!", "d": ["3 segundos, con remanencia", "3 horas, y está protegido", "3 minutos, con remanencia activada"], "j": "m = minutos y segundos (03:00m = 3 min). El + indica que la protección no está activada: se puede cambiar sin ordenador.", "img": null, "cap": "", "cat": ["soft", "tiempos"]}, {"n": 39, "ans": "b", "tema": "T2", "t": "T2 · 3.10", "dif": "M", "tipo": "PROG", "q": "Al simular en LOGO!Soft, ¿qué quieren decir los colores de los cables?", "ok": "Rojo = 1 y azul = 0", "d": ["Rojo = 0 y azul = 1", "Rojo = fase y azul = neutro", "Rojo = entrada y azul = salida"], "j": "Con el botón SIM el programa se ejecuta en el ordenador. Prueba siempre en simulación antes de cargar.", "img": null, "cap": "", "cat": ["soft"]}, {"n": 40, "ans": "a", "tema": "T2", "t": "T2 · 3.10 (en el taller)", "dif": "D", "tipo": "MED", "q": "Vas a cargar el programa y el LOGO! no aparece en la ventana. ¿Qué compruebas?", "ok": "El cable, que esté encendido y que el ordenador esté en la misma red (192.168.0.x)", "d": ["Que el LOGO! esté en RUN antes de cargar", "Que el programa esté en KOP", "Que las salidas tengan 230 V"], "j": "Los tres primeros números de la IP del ordenador y del LOGO! tienen que ser iguales.", "img": null, "cap": "", "cat": ["averias", "soft"]}, {"n": 41, "ans": "d", "tema": "P4", "t": "P4 · E/S", "dif": "M", "tipo": "CAB", "q": "En la P4, ¿qué aparato va a la entrada I4?", "ok": "El sensor crepuscular S2 (o el de inundación, si no hay crepuscular)", "d": ["La tecla ▼ del pulsador S1", "El detector de presencia S3", "El termostato"], "j": "I2 = ▲, I3 = ▼, I4 = crepuscular, I7 = detector de presencia.", "img": null, "cap": "", "cat": ["cableado", "e40"]}, {"n": 42, "ans": "b", "tema": "P4", "t": "P4 · E/S (en el taller)", "dif": "M", "tipo": "PROG", "q": "En tu panel no hay crepuscular y pones el sensor de inundación en I4. ¿Qué cambia en el programa?", "ok": "Nada: mismo cableado y mismo programa; donde dice «de noche», para ti es «hay agua»", "d": ["Hay que negar I4 en todos los programas", "Hay que llevarlo a I7", "Hay que cambiar las AND por OR"], "j": "Los dos son de 5 hilos y se cablean igual: el 14 se cierra al hacerse de noche o al haber agua. Para probarlo, mojas la sonda.", "img": null, "cap": "", "cat": ["e40"]}, {"n": 43, "ans": "d", "tema": "P4", "t": "P4 · Cómo se cablea", "dif": "M", "tipo": "CAB", "q": "¿Cómo se cablea el pulsador doble S1 en la P4?", "ok": "11 al +12 V, 14 a I2 (▲) y 24 a I3 (▼)", "d": ["11 a I2, 14 a I3 y 24 al +12 V", "14 al +12 V, 11 a I2 y 24 a I3", "11 al 0 V, 14 a I2 y 24 a I3"], "j": "El 11 es común a las dos teclas: lleva el +12 V. Cada tecla «deja pasar» el +12 V a su entrada.", "img": null, "cap": "", "cat": ["cableado", "e40"]}, {"n": 44, "ans": "c", "tema": "P4", "t": "P4 · Cómo se cablea", "dif": "D", "tipo": "CAB", "q": "¿Cómo se cablea el sensor crepuscular S2 de 5 hilos en la P4?", "ok": "Rojo al +12 V y negro al 0 V; 11 al +12 V y 14 a I4; el 12 libre", "d": ["Rojo al +12 V y negro al 0 V; 11 al +12 V y 12 a I4", "Rojo a I4 y negro al 0 V; el contacto sin usar", "Rojo y negro a 230 V; 11 al +12 V y 14 a  (12 V) y se miden las entradas; después de cargar el 4.1, Q1 (230 V)", "d": ["Primero Q1 (230 V) y después Q2 (12 V)", "Los dos a la vez", "Q1 primero, para que el detector se vaya calentando"], "j": "Con 12 V el LOGO! se enciende y compruebas las entradas sin peligro. Los 230 V, al final.", "img": null, "cap": "", "cat": ["e40", "seguridad"]}, {"n": 49, "ans": "a", "tema": "P4", "t": "P4 · Comprobación con el polímetro", "dif": "M", "tipo": "MED", "q": "Comprobación de I2. ¿Cómo mides y qué tiene que dar?", "ok": "Tensión continua entre I2 y M: 0 V sin pulsar y 12 V pulsando ▲", "d": ["Tensión alterna entre I2 y M: 0 V sin pulsar y 230 V pulsando", "Continuidad entre I2 y M: pita al pulsar", "Tensión continua entre I2 y M: 12 V sin pulsar y 0 V pulsando"], "j": "Es un sensor en lógica positiva: al pulsar, deja pasar el +12 V a la entrada.", "img": null, "cap": "", "cat": ["e40", "medidas"]}, {"n": 50, "ans": "b", "tema": "P4", "t": "P4 · Comprobación con el polímetro", "dif": "M", "tipo": "MED", "q": "Comprobación de I4 con el crepuscular. Tensión continua entre I4 y M. ¿Qué tiene que dar?", "ok": "0 V con luz y 12 V al taparlo con la mano", "d": ["12 V con luz y 0 V al taparlo", "0 V con luz y 230 V al taparlo", "12 V siempre: el sensor está alimentado"], "j": "Al taparlo, para el sensor es de noche: cierra su 11-14 y lleva el +12 V a I4.", "img": null, "cap": "", "cat": ["e40", "medidas"]}, {"n": 51, "ans": "b", "tema": "P4", "t": "P4 · Comprobación con el polímetro", "dif": "D", "tipo": "MED", "q": "Para medir 0 V en I7, ¿por qué tienes que estar 10 s sin que el detector te vea?", "ok": "Porque su contacto R2 sigue cerrado unos 10 s después de dejar de verte (ruleta R2 al mínimo)", "d": ["Porque el LOGO! tarda 10 s en leer las entradas", "Porque el polímetro tarda en estabilizarse en continua", "Porque I7 es una entrada lenta"], "j": "Con la ruleta R2 al mínimo el contacto se queda cerrado 10 s. Si la subes, tardaría mucho más.", "img": null, "cap": "", "cat": rruptores", "d": ["Todas como interruptores", "Todas como pulsadores", "I2 e I3 como interruptores; I4 e I7 como pulsadores"], "j": "Las teclas vuelven solas al soltar; el crepuscular y el detector se quedan como los dejas.", "img": null, "cap": "", "cat": ["e40", "soft"]}, {"n": 56, "ans": "c", "tema": "P4", "t": "P4 · Los bloques (idea clave)", "dif": "M", "tipo": "PROG", "q": "Usas una AND de cuatro patillas y solo conectas dos. ¿Qué pasa con las otras dos?", "ok": "Nada: se dejan libres y el LOGO! sabe que no cuentan", "d": ["Cuentan como 0 y la AND da siempre 0", "Hay que unirlas a hi (1 fijo)", "Hay que unirlas a una entrada que no se use"], "j": "Las patillas libres no cuentan, ni en la AND ni en la OR.", "img": "p4_bloques.png", "cap": "P4, figura 1: los bloques de la práctica en FUP.", "cat": ["e40", "esquemas", "puertas"]}, {"n": 57, "ans": "a", "tema": "P4", "t": "P4 · 4.1", "dif": "M", "tipo": "TAB", "q": "Ejercicio 4.1. Pulsas a la vez ▲ y ▼. ¿Cómo queda E1?", "ok": "Q1 = 1: la OR da 1 si alguna entrada es 1", "d": ["Q1 = 0: no se pueden pulsar las dos", "Q1 = 0: la OR solo da 1 con una", "Q1 parpadea"], "j": "Q1 = I2 O I3. Con las dos a 1 la OR sigue dando 1.", "img": "p4_41.png", "cap": "P4, figura 2: el programa del ejercicio 4.1 en FUP.", "tab": {"h": ["I2 (▲)", "I3 (▼)", "Q1 (E1)"], "r": [["1", "1", "?"]]}, "cat": ["e41", "esquemas", "puertas", "tablas"]}, {"n": 58, "ans": "c", "tema": "P4", "t": "P4 · 4.1 (para pensar)", "dif": "M", "tipo": "PROG", "q": "Ejercicio 4.1. Cambias la OR por una AND y simulas. ¿Qué cambia?", "ok": "E1 solo se enciende pulsando las dos teclas a la vez", "d": ["Nada: hacen lo mismo", "E1 se enciende con cualquiera de las dos", "E1 se queda encendida al soltar"], "j": "La AND solo da 1 si todas sus entradas (las conectadas) son 1.", "img": "p4_41.png", "cap": "P4, figura 2: el programa del ejercicio 4.1 en FUP.", "cat": ["e41", "esquemas", "puertas"]}, {"n": 59, "ans": "a", "tema": "P4", "t": "P4 · 4.2", "dif": "M", "tipo": "TAB", "q": "Ejercicio 4.2 (luz del portal). Es de día y el detector ve a alguien. ¿Cómo queda E1?", "ok": "Q1 = 0: falta que sea de noche", "d": ["Q1 = 1: basta con que te vea", "Q1 = 1 durante 10 s", "Q1 = 0 porque I7 está a 0"], "j": "Q1 = I4 Y I7. De día I4 = 0, así que la AND da 0 aunque I7 = 1.", "img": null, "cap": "", "tab": {"h": ["I4 (Crepuscular)", "I7 (Presencia)", "Q1 (E1)"], "r": [["0", "1", "?"]]}, "cat": ["e42", "puertas", "tablas"]}, {"n": 60, "ans": "b", "tema": "P4", "t": "P4 · 4.2 (para pensar)", "dif": "D", "tipo": "PROG", "q": "Ejercicio 4.2. De día, tapas el crepuscular con la mano y pasas por delante del detector. ¿Qué pasa?", "ok": "E1 se enciende: el LOGO! solo ve que I4 = 1, como si fuera de noche", "d": ["No se enciende: el LOGO! tiene reloj y sabe que es de día", "Se enciende y se apaga al momento", "Salta el magnetotérmico Q2"], "j": "El LOGO! no ve la luz: ve la foto de la entrada I4. Si el sensor cierra su 11-14, para el programa es de noche.", "img": null, "cap": "", "cat": ["e42"]}, {"n": 61, "ans": "c", "tema": "P4", "t": "P4 · 4.3", "dif": "M", "tipo": "TAB", "q": "Ejercicio 4.3, programa A. Pulsas ▲, es de día y el detector no te ve. ¿Cómo queda E1?", "ok": "Q1 = 0", "d": ["Q1 = 1", "Q1 = 1 solo mientras pulsas", "Depende de la prioridad"], "j": "A = (I2 O I4) Y I7. La OR da 1, pero I7 = 0 y la AND da 0.", "img": "f43a.png", "cap": "Ejercicio 4.3, programa A: (▲ O crepuscular) Y presencia.", "tab": {"h": ["I2 (▲)", "I4 (Crepuscular)", "I7 (Presencia)", "A"], "r": [["1", "0", "0", "?"]]}, "cat": ["e43", "esquemas", "puertas", "tablas"]}, {"n": 62, "ans": "d", "tema": "P4", "t": "P4 · 4.3", "dif": "M", "tipo": "TAB", "q": "Ejercicio 4.3, programa B. Pulsas ▲, es de día y el detector no te ve. ¿Cómo queda E1?", "ok": "Q1 = 1", "d": ["Q1 = 0", "Q1 = 1 solo de noche", "No se puede saber sin simular"], "j": "B = I2 O (I4 Y I7). La AND da 0, pero I2 = 1 entra directo a la OR.", "img": "f43b.png", "cap": "Ejercicio 4.3, programa B: ▲ . Quitas el cable que lleva Q1 a la OR. ¿Qué pasa al soltar ▲?", "ok": "E1 se apaga: solo luce mientras pulsas", "d": ["E1 se queda encendida igual", "E1 ya no se enciende nunca", "E1 se queda encendida y ▼ ya no la apaga"], "j": "Sin realimentación no hay memoria: es como el 4.1.", "img": "f44a.png", "cap": "Ejercicio 4.4 a): luz del salón con realimentación. Q1 vuelve a entrar en la OR.", "cat": ["e44", "esquemas", "memoria"]}, {"n": 67, "ans": "c", "tema": "P4", "t": "P4 · 4.4 a)", "dif": "M", "tipo": "TAB", "q": "Ejercicio 4.4 a). E1 está encendida y pulsas a la vez las dos teclas. ¿Cómo queda?", "ok": "Q1 = 0: gana el apagado", "d": ["Q1 = 1: gana el encendido", "Q1 cambia de estado", "Q1 = 1 mientras pulsas"], "j": "La OR da 1, pero ▼ entra negado en la AND: con ▼ pulsado la AND da 0. Apagar es lo seguro.", "img": "f44a.png", "cap": "Ejercicio 4.4 a): luz del salón con realimentación. Q1 vuelve a entrar en la OR.", "tab": {"h": ["E1 antes", "I2 (▲)", "I3 (▼)", "Q1 (E1)"], "r": [["1", "1", "1", "?"]]}, "cat": ["e44", "esquemas", "memoria", "tablas"]}, {"n": 68, "ans": "d", "tema": "P4", "t": "P4 · 4.4 b)", "dif": "M", "tipo": "MEM", "q": "Ejercicio 4.4 b), con el relé autoenclavador. ¿Qué va a cada patilla y qué prioridad pones?", "ok": "▲ (I2) a S, ▼ (I3) a R, y prioridad RS", "d": ["▲ a S, ▼ a R, y prioridad SR", "▼ a S, ▲ a R, y prioridad RS", "▲ a Trg y ▼ a R, y prioridad RS"], "j": "Con RS, si llegan S y R a la vez, gana el reset: el apagado, que es lo seguro.", "img": null, "cap": "", "cat": ["e44", "memoria"]}, {"n": 69, "ans": "d", "tema": "P4", "t": "P4 · 4.4 c)", "dif": "D", "tipo": "MEM", "q": "Ejercicio 4.4 c): de día la luz se apaga sola y no se puede encender. ¿Qué le llega a la patilla R?", "ok": "▼ O «es de día»: I3 O NO I4", "d": ["▼ Y «es de noche»: I3 Y I4", "I3 O I4", "Solo NO I3"], "j": "Hay dos cosas que tienen que apagar: la tecla ▼ y que sea de día. Se juntan en una OR, con I4 negada.", "img": null, "cap": "", "cat": ["e44", "memoria"]}, , "d": ["Se apaga y se queda apagada", "Se apaga 10 s y vuelve a encenderse", "Se apaga también TC1"], "j": "El impulso en Trg intenta cambiarla, pero mientras S = 1 la salida se pone a 1.", "img": null, "cap": "", "cat": ["e46", "impulsos"]}, {"n": 86, "ans": "b", "tema": "P4", "t": "P4 · 4.6 (para pensar)", "dif": "D", "tipo": "MEM", "q": "Ejercicio 4.6. De día, con E1 apagada y TC1 encendida, pulsas las dos teclas, pero ▲ llega un poco antes. ¿Qué pasa?", "ok": "Al tocar ▲, E1 se enciende; al llegar ▼, R = 1 y se apaga todo", "d": ["E1 se enciende y TC1 se apaga, y así se quedan", "No pasa nada: hay que pulsarlas exactamente a la vez", "Se apaga todo y luego E1 vuelve a encenderse"], "j": "Las teclas nunca llegan a la vez. Por eso el «apagar todo» va a R, que gana: al final queda todo apagado.", "img": null, "cap": "", "cat": ["e46", "impulsos"]}, {"n": 87, "ans": "d", "tema": "P4", "t": "P4 · 4.7", "dif": "M", "tipo": "TIEM", "q": "Ejercicio 4.7 (baño). E1 se apaga 10 s después de que el detector deje de verte. ¿Qué temporizador es?", "ok": "Retardo a la desconexión, con T = 10 s", "d": ["Retardo a la conexión, con T = 10 s", "Relé de impulsos", "Interruptor de alumbrado para escalera, con R = I7"], "j": "Enciende al momento con Trg y tarda en apagar: es el de desconexión.", "img": null, "cap": "", "cat": ["e47", "tiempos"]}, {"n": 88, "ans": "b", "tema": "P4", "t": "P4 · 4.7", "dif": "M", "tipo": "TIEM", "q": "Ejercicio 4.7. E1 se enciende con el detector y también a mano con ▲. ¿Qué le llega al Trg de su temporizador?", "ok": "I7 O I2", "d": ["I7 Y I2", "Solo I7", "I3"], "j": "Las dos cosas encienden: se juntan en una OR. ▼ (I3) va a la patilla R para apagar al momento.", "img": null, "cap": "", "cat": ["e47", "tiempos"]}, {"n": 89, "ans": "b", "tema": "P4", "t": "P4 · 4.7", "dif": "D", "tipo": "TIEM", "q": "Ejercicio 4.7. El extractor TC1 solo arranca si la luz lleva más de 30 s y sigue 20 s después de apagarse. ¿Cómo se hace?", "ok": "Retardo a la conexión (Trg = Q1, 30 s) → retardo a la desconexión (20 s) → Q2", "d": ["Retardo a la desconexión (Trg = Q1, 30 s) → retardo a la conexión (20 s) → Q2", "Un solo retardo a la conexión de 50 s con Trg = Q1", "Retardo a la conexión con Trg = I7 y T = 20 s"], "j": "El primero filtra las visitas cortas; el segundo alarga el funcionamiento para sacar la humedad.", "img": null, "cap": "", "cat": ["e47", "tiempos"]}, {"n": 90, "ans": "d", "tema": "P4", "t": "P4 · 4.7 cronograma", "dif": "M", "tipo": "TIEM", "q": "Ejercicio 4.7, cronograma. En la primera visita (I7 = 1 de 5 a 15 s), ¿cuándo está encendida E1?", "ok": "De 5 a 25 s", "d": ["De 5 a 15 s", "De 15 a 25 s", "De 5 a 35 s"], "j": "Se enciende con I7 y se apaga 10 s después de que I7 vuelva a 0.", "img": "p4_crono.png", "cap": "P4, figura 3: cronograma del ejercicio 4.7. I7 es lo que llega al LOGO! desde el contacto R2 del detector S3.", "cat": ["e47", "esquemas", "tiempos"]}, {"n": 91, "ans": "c", "tema": "P4", "t": "P4 · 4.7 cronograma", "dif": "D", "tipo": "TIEM", "q": "Ejercicio 4.7, cronograma. ¿Arranca el extractor en la primera visita?", "ok": "No: la luz solo está encendida 20 s, menos de 30", "d": ["Sí, a los 30 s de entrar", "Sí, al apagarse la luz, durante 20 s", "Sí, pero solo 10 s"], "j": "El retardo a la conexión necesita que Q1 siga a 1 los 30 s enteros. Si entras solo un momento, no arranca.", "img": "p4_crono.png", "cap": "P4, figura 3: cronograma del ejercicio 4.7. I7 es lo que llega al LOGO! desde el contacto R2 del detector S3.", "cat": ["e47", "esquemas", "tiempos"]}, {"n": 92, "ans": "d", "tema": "P4", "t": "P4 · 4.7 cronograma", "dif": "D", "tipo": "TIEM", "q": "Ejercicio 4.7, cronograma. En la segunda visita (I7 = 1 de 35 a 60 s), ¿cuándo está encendido el extractor TC1?", "ok": "De 65 a 90 s", "d": ["De 35 a 70 s", "De 65 a 70 s", "De 70 a 90 s"], "j": "E1 se enciende a los 35 s y se apaga a los 70. A los 65 lleva 30 s encendida: arranca. Al apagarse la luz (70 s) sigue 20 s más: hasta los 90.", "img": "p4_crono.png", "cap": "P4, figura 3: cronograma del ejercicio 4.7. I7 es lo que llega al LOGO! desde el contacto R2 del detector S3.", "cat": ["e47", "esquemas", "tiempos"]}, {"n": 93, "ans": "c", "tema": "P4", "t": "P4 · 4.7 (para pensar)", "dif": "D", "tipo": "TIEM", "q": "Ejercicio 4.7. El extractor está en marcha y pulsas ▼. ¿Qué pasa?", "ok": "La luz se apaga al momento y el extractor sigue 20 s más", "d": ["Se apagan los dos al momento", "La luz se apaga y el extractor se queda encendido", "No pasa nada: ▼ solo vale de noche"], "j": "▼ va a la R del temporizador de la luz. Al apagarse Q1, el retardo a la desconexión del extractor empieza a contar sus 20 s.", "img": null, "cap": "", "cat": ["e47", "tiempos"]}, {"n": 94, "ans": "c", "tema": "P4", "t": "P4 · 4.7 (en el taller)", "dif": "D", "tipo": "TIEM", "q": "Ejercicio 4.7. En la simulación la luz se apaga 10 s después de quitar I7, pero en el panel tarda unos 20 s desde que te vas. ¿Por qué?", "ok": "El contacto R2 del detector sigue cerrado unos 10 s; el LOGO! empieza a contar cuando se abre", "d": ["El LOGO! va más lento que la simulación", "Está mal el parámetro T", "El detector tiene la ruleta LUX al máximo"], "j": "Aunque la ruleta R2 esté al mínimo, el detector añade su propio tiempo. En la simulación I7 es un interruptor y no pasa.", "img": null, "cap": "", "cat": ["e47", "tiempos"]}, {"n": 95, "ans": "d", "tema": "P4", "t": "P4 · 4.8 paso 1", "dif": "M", "tipo": "MEM", "q": "Ejercicio 4.8, paso 1. ¿Qué es la «orden de bajar»?", "ok": "Una OR con ▼ (I3) e I4", "d": ["Una AND con ▼ e I4", "I4 negada", "Una OR con ▲ y ▼"], "j": "Se usa en los dos sitios donde en el 4.5 iba ▼: el S del relé de bajar y el R del relé de subir.", "img": null, "cap": "", "cat": ["e48", "persianas"]}, {"n": 96, "ans": "c", "tema": "P4", "t": "P4 · 4.8 paso 1", "dif": "D", "tipo": "MEM", "q": "Ejercicio 4.8, paso 1 (I4 sin flanco). Ya es de noche, ha acabado el tiempo de recorrido e intentas subir con ▲. ¿Qué pasa?", "ok": "No sube: la orden de bajar está a 1 toda la noche y hace reset del relé de subir", "d": ["Sube con normalidad", "Sube y vuelve a bajar a los 10 s", "Q3 y Q4 se activan a la vez"], "j": "Con I4 directo, la orden de bajar dura toda la noche. El relé de subir recibe S y R a la vez y, con RS, gana el reset.", "img": null, "cap": "", "cat": ["e48", "memoria", "persianas"]}, {"n": 97, "ans": "d", "tema": "P4", "t": "P4 · 4.8 paso 1", "dif": "D", "tipo": "MEM", "q": "Ejercicio 4.8, paso 1. De noche, ¿qué le pasa a Q4 cada vez que acaba el tiempo de recorrido?", "ok": "Se vuelve a encender: el S del relé de bajar sigue a 1", "d": ["Se apaga y se queda apagada", "Se queda encendida sin parar", "Se enciende Q3 en su lugar"], "j": "El temporizador lo resetea, pero en cuanto Q4 cae, el S (orden de bajar) lo vuelve a poner a 1: el motor recibe tensión una y otra vez.", "img": null, "cap": "", "cat": ["e48", "persianas", "tiempos"]}, {"n": 98, "ans": "b", "tema": "P4", "t": "P4 · 4.8 paso 2", "dif": "M", "tipo": "MEM", "q": "Ejercicio 4.8, paso 2. ¿Qué bloque pones para que la orden de bajar llegue solo al hacerse de noche?", "ok": "Un AND (flanco) con I4, en lugar de I4 en la OR", "d": ["Un NAND (flanco) con I4", "Un retardo a la conexión con I4", "I4 negada"], "j": "El AND (flanco) da un impulso solo cuando I4 pasa de 0 a 1: en el momento en que se hace de noche.", "img": null, "cap": "", "cat": ["e48", "flancos", "persianas"]}, {"n": 99, "ans": "a", "tema": "P4", "t": "P4 · 4.8 (para pensar)", "dif": "D", "tipo": "MEM", "q": "Ejercicio 4.8, paso 2. De noche subes la persiana a mano. ¿Vuelve a bajar sola?", "ok": "No: el flanco solo da el impulso al hacerse de noche; no vuelve a bajar hasta la noche siguiente", "d": ["Sí, en cuanto acaba el tiempo de recorrido", "Sí, cada vez que el detector te ve", "Sí, al soltar ▲"], "j": "Toda la noche I4 = 1, pero el AND (flanco) solo da 1 en el paso de 0 a 1.", "img": null, "cap": "", "cat": ["e48", "flancos", "persianas"]}, {"n": 100, "ans": "d", "tema": "P4", "t": "P4 · 4.8 (¡OJO!)", "dif": "D", "tipo": "SEG", "q": "Ejercicio 4.8. ¿Por qué la orden de bajar, venga de ▼ o del anochecer, tiene que hacer siempre reset del relé de subir?", "ok": "Si no, al hacerse de noche mientras sube, Q3 y Q4 quedarían a 1 a la vez", "d": ["Para que la persiana baje más deprisa", "Para que el temporizador cuente desde cero", "Porque el relé de subir no tiene patilla S"], "j": "Cada orden de un sentido tiene que parar el otro. Es el enclavamiento de la persiana.", "img": null, "cap": "", "cat": ["e48", "persianas", "seguridad"]}];

const TIPO = {TAB:"Tablas de la verdad",PROG:"Programas en FUP",MEM:"Memoria y persianas",TIEM:"Temporizadores",CAB:"Cableado del LOGO!",MED:"Medidas y averías",LOGO:"El autómata por dentro",SEG:"Seguridad"};
const CATS = [["Tipo de pregunta", [["tablas", "Tablas de la verdad"], ["esquemas", "Preguntas con figura"], ["medidas", "Medidas con el polímetro"], ["averias", "Búsqueda de averías"], ["seguridad", "Seguridad"]]], ["Bloques del LOGO!", [["puertas", "Y (AND), O (OR) y NO"], ["flancos", "Flancos"], ["memoria", "Memoria: realimentación y relé autoenclavador"], ["impulsos", "Relé de impulsos"], ["tiempos", "Temporizadores"]]], ["Tema 2", [["logo", "El LOGO! por dentro"], ["scan", "Ciclo de scan"], ["cableado", "Cableado: entradas y salidas"], ["logica", "Lógica negativa, PNP y NPN"], ["salidas", "Salidas a relé"], ["soft", "LOGO!Soft: simular y cargar"], ["persianas", "Persianas"]]], ["Ejercicios de la Práctica 4", [["e40", "4.0 Antes de empezar"], ["e41", "4.1 Primer programa"], ["e42", "4.2 Luz del portal"], ["e43", "4.3 ¿Cuál está bien?"], ["e44", "4.4 Marcha y paro"], ["e45", "4.5 Persiana"], ["e46", "4.6 Recibidor"], ["e47", "4.7 Baño"], ["e48", "4.8 Persiana automática"]]]];
const app = document.getElementById('app');

/* ---------- tema claro/oscuro ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  if (e.key === 'ArrowLeft') { go(state.i - 1); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') { go(state.i + 1); e.preventDefault(); return; }
  if (e.key === 'PageDown') { go(Math.min(state.list.length - 1, state.i + 10)); e.preventDefault(); return; }
  if (e.key === 'PageUp') { go(Math.max(0, state.i - 10)); e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pts = s => esc(s).replace(/[\u24B6-\u24CF]/g, c => `<b class="pt">${String.fromCharCode(c.charCodeAt(0) - 0x24B6 + 65)}</b>`);

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' }; drawMap();
  const cnt = t => DATA.filter(q => q.tema === t).length;
  const N = DATA.length, B = 25, blocks = [];
  for (let a = 1; a <= N; a += B) blocks.push([a, Math.min(a + B - 1, N)]);
  let mode = 'orden';
  try { mode = localStorage.getItem('testModoDom') || 'orden'; } catch(e) {}
  app.innerHTML = `
  <h1>Test Bloque 2 · <span>Domótica</span></h1>
  <p class="sub">${N} preguntas del Tema 2 (el autómata programable) y de la Práctica 4 (cablear el LOGO! y programar en FUP), con las entradas y salidas de la práctica: I2 ▲, I3 ▼, I4 crepuscular, I7 presencia · Q1 E1, Q2 TC1, Q3 subir, Q4 bajar. Recuerda: <b>borne = tornillo</b> del aparato.</p>
  <div class="card">
    <fieldset><legend>¿Cómo quieres hacerlo?</legend><div class="chips">
      <label class="chip"><input type="radio" name="modo" value="orden" ${mode==='orden'?'checked':''}><span>En orden</span></label>
      <label class="chip"><input type="radio" name="modo" value="azar" ${mode==='azar'?'checked':''}><span>Al azar</span></label>
      <label class="chip"><input type="radio" name="modo" value="cat" ${mode==='cat'?'checked':''}><span>Por tema</span></label>
    </div></fieldset>
    <div id="m-orden">
      <fieldset><legend>Qué preguntas</legend><div class="chips">
        ${blocks.map(([a,b],i) => `<label class="chip"><input type="radio" name="bloque" value="${a}-${b}" ${i===0?'checked':''}><span>${a} a ${b}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="bloque" value="1-${N}"><span>Todas (1 a ${N})</span></label>
      </div></fieldset>
    </div>
    <div id="m-azar">
      <fieldset><legend>Tema y prácticas</legend><div class="chips">
        ${Object.keys(TEMAS).filter(t => cnt(t) > 0).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
      </div></fieldset>
      <fieldset><legend>Tipo de pregunta</legend><div class="chips">
        ${Object.keys(TIPO).filter(t => DATA.some(q => q.tipo === t)).map(t => `<label class="chip"><input type="checkbox" name="tipo" value="${t}" checked><span>${TIPO[t]} <span class="cnt">(${DATA.filter(q => q.tipo === t).length})</span></span></label>`).join('')}
      </div></fieldset>
      <fieldset><legend>Dificultad</legend><div class="chips">
        <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
        <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
        <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
      </div></fieldset>
      <fieldset><legend>Número de preguntas</legend><div class="chips">
        ${[10,20,40].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
      </div></fieldset>
    </div>
    <div id="m-cat">
      <p class="cnt" style="margin:0 0 8px">Elige uno o varios temas: saldrán preguntas al azar solo de lo que marques.</p>
      <div class="cbtns"><button type="button" id="call">Marcar todos</button><button type="button" id="cnone">Quitar todos</button></div>
      ${CATS.map(([g, items]) => `<div class="cgrp"><h3>${g}</h3><div class="chips">
        ${items.filter(([k]) => DATA.some(q => q.cat.includes(k))).map(([k, l]) => `<label class="chip"><input type="checkbox" name="cat" value="${k}"><span>${l} <span class="cnt">(${DATA.filter(q => q.cat.includes(k)).length})</span></span></label>`).join('')}
      </div></div>`).join('')}
      <fieldset><legend>Número de preguntas</legend><div class="chips">
        ${[10,20].map((n,i) => `<label class="chip"><input type="radio" name="numc" value="${n}" ${i===0?'checked':''}><span>${n}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="numc" value="0"><span>Todas</span></label>
      </div></fieldset>
    </div>
    <p id="avail" class="cnt"></p>
    <button class="go" id="go">Empezar</button>
  </div>
  <div class="box"><span class="lbl">CÓMO FUNCIONA</span>
    Elige una respuesta tocándola (o con las teclas A, B, C, D). Aciertes o no, verás <b>por qué</b> es esa la respuesta.
    Toca una figura para verla en grande. Si sales a medias, el test se queda guardado en este móvil u ordenador y puedes seguirlo otro día.<br>
    <b>En orden</b>: las preguntas salen siempre con el mismo número y las respuestas en el mismo orden, como en el test en papel.
    <b>Al azar</b>: cambian las preguntas y el orden de las respuestas cada vez.
    <b>Por tema</b>: practica solo lo que quieras (por ejemplo, temporizadores o la persiana).</div>`;
  const upd = () => {
    const m = app.querySelector('input[name=modo]:checked').value;
    document.getElementById('m-orden').style.display = m === 'orden' ? '' : 'none';
    document.getElementById('m-azar').style.display = m === 'azar' ? '' : 'none';
    document.getElementById('m-cat').style.display = m === 'cat' ? '' : 'none';
    try { localStorage.setItem('testModoDom', m); } catch(e) {}
    const pool = pick();
    document.getElementById('avail').textContent = m === 'orden'
      ? `${pool.length} preguntas, de la ${pool[0].n} a la ${pool[pool.length-1].n}.`
      : m === 'cat'
      ? (catPool().length ? `Hay ${catPool().length} preguntas de estos temas; te saldrán ${pool.length}.` : 'Marca al menos un tema.')
      : `Hay ${filtered().length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  document.getElementById('call').onclick = () => { app.querySelectorAll('input[name=cat]').forEach(i => i.checked = true); upd(); };
  document.getElementById('cnone').onclick = () => { app.querySelectorAll('input[name=cat]').forEach(i => i.checked = false); upd(); };
  upd();
  offerProg();
  document.getElementById('go').onclick = () => {
    const pool = pick(), ord = state.mode === 'orden';
    state = { screen: 'q', mode: ord ? 'orden' : 'azar', list: pool.map(q => item(q, ord)), i: 0, ok: 0, answered: false };
    show();
  };
}
function item(q, ord){ return { q, order: ord ? fixedOrder(q) : shuffle([0,1,2,3]), pick: null }; }
function fixedOrder(q){ const a = 'abcd'.indexOf(q.ans); let d = 1; return [0,1,2,3].map(k => k === a ? 0 : d++); }
function pick(){
  const m = app.querySelector('input[name=modo]:checked').value;
  state.mode = m;
  if (m === 'orden') {
    const [a, b] = app.querySelector('input[name=bloque]:checked').value.split('-').map(Number);
    return DATA.filter(q => q.n >= a && q.n <= b);
  }
  if (m === 'cat') {
    const nc = +app.querySelector('input[name=numc]:checked').value, pc = shuffle(catPool());
    return nc ? pc.slice(0, nc) : pc;
  }
  const n = +app.querySelector('input[name=num]:checked').value;
  let pool = shuffle(filtered());
  return n ? pool.slice(0, n) : pool;
}
function catPool(){
  const cs = [...app.querySelectorAll('input[name=cat]:checked')].map(i => i.value);
  return DATA.filter(q => q.cat.some(c => cs.includes(c)));
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  const tipos = [...app.querySelectorAll('input[name=tipo]:checked')].map(i => i.value);
  return DATA.filter(q => temas.includes(q.tema) && tipos.includes(q.tipo) && (dif === 'all' || q.dif === dif));
}

/* ---------- test a medias: se guarda en este navegador para seguirlo otro día ---------- */
const PKEY = 'testProg:' + (location.pathname.split('/').pop() || 'test');
function saveProg(){
  try {
    if (state.screen !== 'q' || !state.list.some(x => x.pick !== null)) return;
    localStorage.setItem(PKEY, JSON.stringify({ v: 1, t: Date.now(), mode: state.mode, i: state.i, list: state.list.map(x => [x.q.n, x.order, x.pick]) }));
  } catch(e) {}
}
function clearProg(){ try { localStorage.removeItem(PKEY); } catch(e) {} }
function loadProg(){
  try {
    const p = JSON.parse(localStorage.getItem(PKEY) || 'null');
    if (!p || p.v !== 1 || !Array.isArray(p.list) || !p.list.length) return null;
    const byn = {}; DATA.forEach(q => byn[q.n] = q);
    const list = p.list.map(a => {
      const q = byn[a[0]], o = a[1], k = a[2];
      if (!q || !Array.isArray(o) || o.slice().sort().join('') !== '0123') return null;
      return { q, order: o, pick: (k === 0 || k === 1 || k === 2 || k === 3) ? k : null };
    });
    if (list.some(x => !x)) return null;
    const done = list.filter(x => x.pick !== null).length;
    if (!done || done === list.length) return null;
    return { mode: p.mode === 'orden' ? 'orden' : 'azar', list, done, i: Math.max(0, Math.min(list.length - 1, p.i | 0)),
             ok: list.filter(x => x.pick !== null && x.order[x.pick] === 0).length };
  } catch(e) { return null; }
}
function offerProg(){
  const p = loadProg(); if (!p) return;
  const d = document.createElement('div'); d.className = 'card resume'; d.id = 'resume';
  d.innerHTML = `<b>Tienes un test a medias.</b> Llevas ${p.done} de ${p.list.length} preguntas contestadas y ${p.ok} ${p.ok === 1 ? 'acierto' : 'aciertos'}.
    <div class="nav" style="justify-content:flex-start;margin-top:10px"><button class="go" id="cont">Seguir donde lo dejé</button><button class="go ghost" id="drop">Borrarlo</button></div>`;
  app.insertBefore(d, app.querySelector('.card'));
  document.getElementById('cont').onclick = () => {
    const first = p.list.findIndex(x => x.pick === null);
    state = { screen: 'q', mode: p.mode, list: p.list, i: first >= 0 ? first : p.i, ok: p.ok, answered: false };
    show();
  };
  document.getElementById('drop').onclick = () => { clearProg(); d.remove(); };
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span class="tag nq">Nº ${q.n}</span><span>${state.i+1} de ${n}</span>
    <span class="tag">${q.tema === 'T2' ? 'Tema 2' : TEMAS[q.tema]}</span><span class="tag">${TIPO[q.tipo]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${state.list.filter(x => x.pick !== null).length/n*100}%"></i></div>
  <div class="jump">
    <button class="go ghost" id="prev" ${state.i === 0 ? 'disabled' : ''} aria-label="Pregunta anterior">←<span class="tx"> Anterior</span></button>
    <button class="go ghost" id="m10" ${state.i === 0 ? 'disabled' : ''} aria-label="Retroceder 10 preguntas">−10</button>
    <button class="go ghost" id="tg" aria-expanded="false" aria-controls="qg">Ir a la pregunta… ▾</button>
    <button class="go ghost" id="p10" ${state.i === n - 1 ? 'disabled' : ''} aria-label="Avanzar 10 preguntas">+10</button>
    <button class="go ghost" id="nx" ${state.i === n - 1 ? 'disabled' : ''} aria-label="Pregunta siguiente"><span class="tx">Siguiente </span>→</button>
    <div class="qgrid" id="qg" hidden>
      ${state.list.map((x,k) => `<button data-j="${k}" class="${x.pick === null ? '' : (x.order[x.pick] === 0 ? 'ok' : 'ko')}${k === state.i ? ' cur' : ''}">${lab(x,k)}</button>`).join('')}
      <p class="leg">Verde: acertada · Rojo: fallada · Gris: sin contestar. Con el teclado: flechas ← → (de una en una) y AvPág / RePág (de 10 en 10).</p>
      <button class="go fin" id="fin">Terminar y ver resultado</button>
    </div>
  </div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Esquema: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext">${pts(q.q)}</div>
    ${q.tab ? tabla(q.tab) : ''}
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${pts(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById('prev').onclick = () => go(state.i - 1);
  document.getElementById('nx').onclick = () => go(state.i + 1);
  document.getElementById('m10').onclick = () => go(Math.max(0, state.i - 10));
  document.getElementById('p10').onclick = () => go(Math.min(state.list.length - 1, state.i + 10));
  document.getElementById('fin').onclick = result;
  const tg = document.getElementById('tg'), qg = document.getElementById('qg');
  tg.onclick = () => { qg.hidden = !qg.hidden; tg.setAttribute('aria-expanded', !qg.hidden); };
  app.querySelectorAll('.qgrid button[data-j]').forEach(b => b.onclick = () => go(+b.dataset.j));
  if (state.answered) paint();
  drawMap();
  window.scrollTo({ top: 0 });
}
function tabla(t){
  return `<div class="tw"><table class="tt"><thead><tr>${t.h.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.r.map(r => `<tr>${r.map(c => c === '?' ? '<td class="qq">?</td>' : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="hint" style="margin-top:0">1 = sí (cerrado, pulsado, activado, encendido) · 0 = no.</p>`;
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint(); saveProg();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la opción ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${pts(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
  drawMap();
}
function lab(x, k){ return state.mode === 'orden' ? x.q.n : k + 1; }
function go(k){ if (k < 0 || k >= state.list.length) return; state.i = k; show(); saveProg(); }
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); saveProg(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end'; drawMap();
  if (state.list.every(it => it.pick !== null)) clearProg();
  const n = state.list.length, ans = state.list.filter(it => it.pick !== null), blank = state.list.filter(it => it.pick === null);
  const nota = ans.length ? state.ok / ans.length * 10 : 0;
  const fails = ans.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${ans.length}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
    ${blank.length ? `<p class="cnt" style="margin:6px 0 0">Has contestado ${ans.length} de ${n}. Las ${blank.length} sin contestar no cuentan en la nota.</p>` : ''}
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">Nº ${it.q.n}. ${pts(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${pts(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${pts(a[0])}</div>
      <div class="cnt">${pts(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    ${blank.length ? '<button class="go ghost" id="blank">Hacer las que faltan</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { state = { screen: 'q', mode: state.mode, list: (state.mode === 'orden' ? fails : shuffle(fails)).map(it => item(it.q, state.mode === 'orden')), i: 0, ok: 0, answered: false }; show(); };
  const bl = document.getElementById('blank');
  if (bl) bl.onclick = () => { const m = state.mode; state = { screen: 'q', mode: m, list: blank.map(it => item(it.q, m === 'orden')), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}

/* ---------- mapa de preguntas y marcador (a los lados; en el móvil, barra de abajo) ---------- */
const mapL = document.createElement('aside'), mapR = document.createElement('aside'), qbar = document.createElement('div'), qsheet = document.createElement('div');
mapL.className = 'qmap l'; mapR.className = 'qmap r'; qbar.className = 'qbar'; qsheet.className = 'qsheet'; qsheet.hidden = true;
mapL.setAttribute('aria-label', 'Mapa de preguntas'); mapR.setAttribute('aria-label', 'Cómo vas');
document.body.append(mapL, mapR, qsheet, qbar);
qbar.onclick = () => { qsheet.hidden = !qsheet.hidden; };
function qcls(x, k){ return (x.pick === null ? '' : (x.order[x.pick] === 0 ? 'ok' : 'ko')) + (k === state.i ? ' cur' : ''); }
function gridHTML(){
  const L = state.list; let h = '';
  for (let a = 0; a < L.length; a += 10) {
    const b = Math.min(a + 9, L.length - 1);
    h += `<div class="qblk"><span>${lab(L[a], a)} a ${lab(L[b], b)}</span><div class="g">` + L.slice(a, a + 10).map((x, j) => `<button data-j="${a + j}" class="${qcls(x, a + j)}" aria-label="Pregunta ${lab(x, a + j)}">${lab(x, a + j)}</button>`).join('') + '</div></div>';
  }
  return h;
}
function drawMap(){
  const on = state.screen === 'q'; document.body.classList.toggle('inq', on);
  if (!on) { qsheet.hidden = true; return; }
  const L = state.list, n = L.length, ans = L.filter(x => x.pick !== null), ok = ans.filter(x => x.order[x.pick] === 0).length, ko = ans.length - ok;
  const nota = ans.length ? (ok / ans.length * 10).toFixed(1).replace('.', ',') : '–';
  mapL.innerHTML = '<h2>Preguntas</h2>' + gridHTML() + '<p class="leg"><i class="ok"></i>acertada <i class="ko"></i>fallada <i></i>sin contestar</p>';
  mapR.innerHTML = `<h2>Cómo vas</h2><div class="sc ok"><b>${ok}</b>aciertos</div><div class="sc ko"><b>${ko}</b>fallos</div><div class="sc"><b>${n - ans.length}</b>sin contestar</div><div class="sc nota">Nota: <b>${nota}</b><small>solo cuenta lo contestado</small></div><button class="go fin" id="finR">Terminar y ver resultado</button>`;
  qbar.innerHTML = `<div class="segs">${L.map((x, k) => `<i class="${qcls(x, k)}"></i>`).join('')}</div><div class="tx">${state.i + 1} de ${n} · <span class="ok">✔ ${ok}</span> · <span class="ko">✘ ${ko}</span><span class="more">▴ mapa de preguntas</span></div>`;
  qsheet.innerHTML = gridHTML() + '<button class="go fin" id="finS">Terminar y ver resultado</button>';
  mapL.querySelectorAll('button[data-j]').forEach(b => b.onclick = () => go(+b.dataset.j));
  qsheet.querySelectorAll('button[data-j]').forEach(b => b.onclick = () => { qsheet.hidden = true; go(+b.dataset.j); });
  document.getElementById('finR').onclick = result;
  document.getElementById('finS').onclick = () => { qsheet.hidden = true; result(); };
  const c = mapL.querySelector('.cur'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest' });
}
start();
</script>
</body>
</html>
