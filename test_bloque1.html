<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>Test Bloque 1 · Domótica 2MT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f1; --card:#ffffff; --ink:#1d2320; --muted:#5d6862; --line:#d9e0d4;
  --green:#4e8a1e; --green-soft:#e6f2da; --red:#c0392b; --red-soft:#fbe4e1;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --yellow:#b7860b; --yellow-soft:#fdf5dc;
  --blue:#1f5fbf; --btn:#eef2ea; --on-green:#fff; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
  --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
  --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
  --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --card:#1e2420; --ink:#e7ece8; --muted:#a3ada6; --line:#34403a;
    --green:#8bc34a; --green-soft:#24331b; --red:#ef6b5d; --red-soft:#3a201d;
    --ok:#7ccf80; --ok-soft:#1d3320; --yellow:#e7c25a; --yellow-soft:#3a3218;
    --blue:#7aa7f0; --btn:#262e29; --on-green:#10200a; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;font-size:17px;line-height:1.45}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--green);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.back{border:1px solid var(--line);background:var(--btn);color:var(--ink);padding:6px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--green)}
.crumbs{font-size:14px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--green);text-decoration:none}
.crumbs b{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--btn);color:var(--ink);width:38px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:26px;margin:6px 0 2px;font-weight:700}
h1 span{color:var(--green)}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.box{border-left:5px solid var(--green);background:var(--green-soft);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .lbl{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--green);display:block;margin-bottom:2px}
.box.why{border-color:var(--yellow);background:var(--yellow-soft)}
.box.why .lbl{color:var(--yellow)}
fieldset{border:none;padding:0;margin:0 0 14px}
legend{font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip>span{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--btn);cursor:pointer;font-size:15px;user-select:none}
.chip input:checked+span{border-color:var(--green);background:var(--green-soft);font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.cnt{color:var(--muted);font-size:13px}
.go{background:var(--green);color:var(--on-green);border:none;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--btn);color:var(--ink);border:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--btn)}
.tag.nq{font-weight:700;color:var(--ink);border-color:var(--green)}
.tag.d{border-color:var(--red);color:var(--red)}
.score{margin-left:auto;font-weight:700;color:var(--ink)}
.qtext{font-size:19px;font-weight:700;margin:6px 0 12px}
figure{margin:0 0 12px;text-align:center}
figure img{max-width:100%;max-height:520px;background:#fff;border-radius:8px;padding:6px;border:1px solid var(--line);cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);font-style:italic;margin-top:4px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--btn);font-weight:700;font-size:14px}
.opt:disabled{cursor:default}
.card.resume{border-left:5px solid var(--yellow);background:var(--yellow-soft)}
.pt{display:inline-block;min-width:1.5em;height:1.5em;line-height:calc(1.5em - 3px);padding:0 .12em;margin:0 .06em;border-radius:999px;background:#FFDD40;color:#111;border:1.5px solid #111;font-weight:700;font-size:.82em;text-align:center;vertical-align:.1em;font-style:normal}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.verdict{font-weight:700;font-size:18px;margin-top:12px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--red)}
.nav{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.big{font-size:44px;font-weight:700;color:var(--green);margin:0}
.review{border-top:1px solid var(--line);padding:12px 0}
.review .rq{font-weight:700}
.review .ra{color:var(--ok);font-weight:700}
.review .ry{color:var(--red)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.tw{overflow-x:auto;margin:0 0 6px}
.tt{border-collapse:collapse;margin:0 auto;font-size:15px;text-align:center}
.tt th,.tt td{border:1.5px solid var(--line);padding:6px 10px;min-width:44px}
.tt th{background:var(--green-soft);font-weight:700}
.tt td{font-weight:700;font-size:17px}
.tt td.qq{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow)}
.cgrp{margin:0 0 10px}
.cgrp h3{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:6px 0 6px}
.cbtns{display:flex;gap:8px;margin:0 0 8px}
.cbtns button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.jump{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:8px;margin:0 0 12px}
.jump>.go{padding:8px 14px;font-size:15px}
.jump>.go.ghost[aria-expanded=true]{border-color:var(--green);background:var(--green-soft)}
.qgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.qgrid[hidden]{display:none}
.qgrid button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:8px;padding:7px 0;cursor:pointer}
.qgrid button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qgrid button.cur{outline:3px solid var(--green);outline-offset:1px}
.qgrid .leg{grid-column:1/-1;font-size:13px;color:var(--muted);margin:2px 0 0}
.qgrid .go.fin{grid-column:1/-1;margin-top:4px;color:var(--on-green);background:var(--green);border:none;padding:10px}
@media (max-width:480px){.jump{gap:6px}.jump .tx{display:none}.jump>.go{padding:8px 10px;font-size:14px}}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px;padding:8px}
@media (max-width:560px){body{font-size:16px}.qtext{font-size:17px}h1{font-size:22px}.crumbs{font-size:12px}}

/* ---------- mapa de preguntas y marcador ---------- */
.qmap,.qbar,.qsheet{display:none}
.qmap h2{margin:0 0 8px;font-size:15px}
.qblk{margin:0 0 8px}.qblk>span{display:block;font-size:11px;color:var(--muted);margin:0 0 3px}
.qblk .g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qblk button{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:var(--btn);color:var(--ink);border-radius:6px;padding:5px 0;cursor:pointer}
.qblk button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qblk button.ko{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.qblk button.cur{outline:3px solid var(--green);outline-offset:1px}
.qmap .leg{font-size:11px;color:var(--muted);margin:6px 0 0}
.qmap .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line);margin:0 3px 0 6px;vertical-align:-1px}
.qmap .leg i:first-child{margin-left:0}
.qmap .leg i.ok{background:var(--ok-soft);border-color:var(--ok)}.qmap .leg i.ko{background:var(--red-soft);border-color:var(--red)}
.sc{font-size:15px;margin:0 0 6px}.sc b{font-size:22px;margin-right:4px}.sc.ok b{color:var(--ok)}.sc.ko b{color:var(--red)}
.sc.nota{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.sc small{display:block;color:var(--muted);font-size:11px}
.qmap .fin,.qsheet .fin{width:100%;margin-top:8px;font-size:14px;padding:8px}
@media (min-width:1240px){
  body.inq .qmap{display:block;position:fixed;top:76px;max-height:calc(100vh - 92px);overflow:auto;width:min(230px,calc((100vw - 860px)/2 - 30px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
  body.inq .qmap.l{right:calc(50% + 444px)} body.inq .qmap.r{left:calc(50% + 444px)}
}
@media (max-width:1239px){
  body.inq .qbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));cursor:pointer;box-shadow:0 -4px 12px rgba(0,0,0,.15)}
  .qbar .segs{display:flex;gap:1px;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
  .qbar .segs i{flex:1;background:var(--btn)}.qbar .segs i.ok{background:var(--ok)}.qbar .segs i.ko{background:var(--red)}.qbar .segs i.cur{box-shadow:inset 0 0 0 2px var(--ink)}
  .qbar .tx{font-size:14px;font-weight:700;margin-top:4px;display:flex;gap:6px;align-items:center}.qbar .tx .ok{color:var(--ok)}.qbar .tx .ko{color:var(--red)}.qbar .more{margin-left:auto;color:var(--muted);font-weight:400}
  body.inq .qsheet{display:block;position:fixed;left:0;right:0;bottom:46px;max-height:62vh;overflow:auto;z-index:14;background:var(--card);border-top:1px solid var(--line);padding:10px 12px 14px;box-shadow:0 -6px 16px rgba(0,0,0,.25)}
  body.inq .qsheet[hidden]{display:none}
  .qsheet .qblk .g{grid-template-columns:repeat(10,1fr)}
  .qsheet .qblk button{padding:8px 0}
  body.inq main{padding-bottom:110px}
}
</style>
</head>

<script>
const DATA = [{"n": 1, "ans": "a", "tema": "T1", "t": "T1 · 2.1", "dif": "M", "tipo": "APA", "q": "¿Cuál de estos sensores del aula es pasivo (no necesita alimentación)?", "ok": "El termostato bimetálico", "d": ["El detector de presencia", "El sensor crepuscular de 5 hilos", "El sensor de inundación de 5 hilos"], "j": "El termostato solo tiene una lámina que se curva con el calor y mueve el contacto. Los otros llevan electrónica.", "img": null, "cap": "", "cat": ["e21", "sensores"]}, {"n": 2, "ans": "b", "tema": "T1", "t": "T1 · 2.1 (¡OJO!)", "dif": "D", "tipo": "APA", "q": "El detector de presencia se llama PIR, «infrarrojo pasivo». Eléctricamente, ¿cómo es?", "ok": "Activo: sin alimentación (230 V) no funciona", "d": ["Pasivo: no necesita alimentación", "Pasivo: funciona solo con su contacto", "Activo, pero solo a 12 Vcc"], "j": "«Pasivo» se refiere a que no emite nada: solo ve el calor de las personas. Pero lleva electrónica y necesita L y N.", "img": null, "cap": "", "cat": ["e21", "sensores"]}, {"n": 3, "ans": "c", "tema": "T1", "t": "T1 · 2.7", "dif": "M", "tipo": "SIM", "q": "¿Qué son los 5 hilos del sensor crepuscular del aula?", "ok": "+ (rojo) y − (negro) de 12 Vcc, más común, NA y NC del contacto", "d": ["Fase, neutro, tierra, NA y NC", "+ y − de 12 Vcc, más tres salidas de 12 V", "Fase y neutro, más común, NA y NC"], "j": "Son dos circuitos en el mismo aparato: la alimentación a 12 Vcc y un contacto seco conmutado 11-12-14.", "img": null, "cap": "", "cat": ["sensores"]}, {"n": 4, "ans": "d", "tema": "T1", "t": "T1 · 2.7 (¡OJO!)", "dif": "M", "tipo": "SEG", "q": "¿Qué pasa si conectas los hilos rojo y negro del sensor de 5 hilos a 230 Vca?", "ok": "La placa se quema al instante", "d": ["Nada: admite hasta 230 V", "Funciona, pero el contacto se invierte", "Salta el diferencial y no se estropea nada"], "j": "Rojo y negro son la alimentación de 12 Vcc (admite hasta 24 Vcc). Los 230 V solo pueden ir por el contacto.", "img": null, "cap": "", "cat": ["seguridad", "sensores"]}, {"n": 5, "ans": "b", "tema": "T1", "t": "T1 · 2.2 (idea clave)", "dif": "M", "tipo": "SIM", "q": "¿Qué es un contacto «seco» o libre de potencial?", "ok": "Un contacto sin tensión propia: pasa la tensión que tú le lleves", "d": ["Un contacto que solo funciona en continua", "Un contacto que da 12 V cuando se cierra", "Un contacto que no se puede mojar"], "j": "Es como un interruptor suelto. Por eso un sensor alimentado a 12 Vcc puede tener su contacto en un circuito de 230 Vca.", "img": null, "cap": "", "cat": ["e22", "sensores"]}, {"n": 6, "ans": "a", "tema": "T1", "t": "T1 · 2.2 (PNP)", "dif": "D", "tipo": "SIM", "q": "Sensor de 3 hilos a 24 Vcc con salida PNP. ¿Dónde se conecta la carga?", "ok": "Entre la salida y el 0 V (−)", "d": ["Entre el +24 V y la salida", "Entre la salida y la fase de 230 V", "Entre el +24 V y el 0 V"], "j": "La salida PNP da «positivo» al detectar. Nunca se mete en un circuito de 230 Vca: para eso se pone un relé de 24 Vcc.", "img": null, "cap": "", "cat": ["e22", "reles", "sensores"]}, {"n": 7, "ans": "c", "tema": "T1", "t": "T1 · 2.6", "dif": "M", "tipo": "APA", "q": "En el detector Niessen del aula, ¿qué diferencia hay entre la salida LS y la R2?", "ok": "LS da 230 V a la lámpara; R2 es un contacto seco", "d": ["LS es un contacto seco; R2 da 230 V", "Las dos dan 230 V", "Las dos son contactos secos"], "j": "Con LS la lámpara va entre LS y N, sin relé. R2 sirve para mandar sobre la bobina de un relé o entrar en una cadena de contactos.", "img": null, "cap": "", "cat": ["reles", "sensores"]}, {"n": 8, "ans": "d", "tema": "T1", "t": "T1 · 2.6 (¡OJO!)", "dif": "M", "tipo": "APA", "q": "Para probar el detector en clase, ¿cómo lo ajustas?", "ok": "LUX en el sol y R1, R2 al mínimo", "d": ["LUX en la luna y R1, R2 al máximo", "LUX en la luna y R1, R2 al mínimo", "LUX en el sol y R1, R2 al máximo"], "j": "Con la luna no se enciende con la luz del aula; con los tiempos al máximo tardaría hasta 12 o 30 minutos en apagarse.", "img": null, "cap": "", "cat": ["sensores"]}, {"n": 9, "ans": "a", "tema": "T1", "t": "T1 · 3.2 (pista)", "dif": "M", "tipo": "SIM", "q": "En un relé, ¿qué es el borne 24?", "ok": "El NA del segundo contacto", "d": ["El NC del segundo contacto", "El común del segundo contacto", "El NA del cuarto contacto"], "j": "Primera cifra: número de contacto. Segunda: función (1 común, 2 NC, 4 NA).", "img": null, "cap": "", "cat": ["reles"]}, {"n": 10, "ans": "d", "tema": "T1", "t": "T1 · 3.3", "dif": "D", "tipo": "SIM", "q": "Relé de 4 contactos en su base. ¿Qué números de base tiene el contacto 21-22-24?", "ok": "Común 10, NC 2, NA 6", "d": ["Común 2, NC 6, NA 10", "Común 21, NC 22, NA 24", "Común 9, NC 1, NA 5"], "j": "Está en la 2.ª posición: NC = n (2), NA = n + 4 (6), común = n + 8 (10).", "img": "fig4.png", "cap": "Tema 1, figura 4: números de la base (negro) y su numeración normalizada (rojo).", "cat": ["esquemas", "reles"]}, {"n": 11, "ans": "c", "tema": "T1", "t": "T1 · 3.3 (¡OJO!)", "dif": "D", "tipo": "SIM", "q": "Relé de 2 contactos (8 bornes). ¿En qué tornillo de la base está el común 21?", "ok": "En el 12", "d": ["En el 10", "En el 2", "En el 21"], "j": "El de 2 contactos usa las posiciones 1.ª y 4.ª. El segundo contacto es 12-4-8 (21-22-24).", "img": "fig4.png", "cap": "Tema 1, figura 4: números de la base (negro) y su numeración normalizada (rojo).", "cat": ["esquemas", "reles"]}, {"n": 12, "ans": "b", "tema": "T1", "t": "T1 · 3.3", "dif": "M", "tipo": "SIM", "q": "¿En qué tornillos de la base va siempre la bobina del relé?", "ok": "13 (A1) y 14 (A2)", "d": ["1 (A1) y 2 (A2)", "9 (A1) y 5 (A2)", "11 (A1) y 14 (A2)"], "j": "La bobina es siempre 13-14 en la base, tenga el relé 2, 3 o 4 contactos.", "img": "fig4.png", "cap": "Tema 1, figura 4: números de la base (negro) y su numeración normalizada (rojo).", "cat": ["esquemas", "reles"]}, {"n": 13, "ans": "c", "tema": "T1", "t": "T1 · 3.1", "dif": "M", "tipo": "PULSA", "q": "Un sensor de inundación de 12 Vcc tiene que cortar una electroválvula de 230 Vca. ¿Para qué el relé?", "ok": "Para separar circuitos y tensiones: la bobina a 12 V y el contacto a 230 V", "d": ["Para que la válvula consuma menos", "Para convertir 12 Vcc en 230 Vca", "No hace falta: el sensor no tiene contacto"], "j": "El sensor solo mueve la bobina; la carga va por los contactos. Pueden ser tensiones distintas.", "img": "fig3.png", "cap": "Tema 1, figura 3: un sensor de 12 Vcc enciende una lámpara de 230 Vca a través del relé KA1.", "cat": ["esquemas", "reles", "sensores", "valvulas"]}, {"n": 14, "ans": "d", "tema": "T1", "t": "T1 · 3.2 (¡OJO!)", "dif": "M", "tipo": "APA", "q": "Mandas la bobina de KA1 con el contacto de un sensor que está en el circuito de 12 Vcc. ¿Qué bobina tiene que tener el relé?", "ok": "Bobina de 12 Vcc", "d": ["Bobina de 230 Vca", "Da igual: la bobina vale para todo", "La de la tensión de la lámpara"], "j": "La bobina tiene la tensión del circuito que la manda. Los contactos no tienen tensión propia.", "img": "fig3.png", "cap": "Tema 1, figura 3: un sensor de 12 Vcc enciende una lámpara de 230 Vca a través del relé KA1.", "cat": ["esquemas", "reles", "sensores"]}, {"n": 15, "ans": "a", "tema": "T1", "t": "T1 · 4.3 (¡OJO!)", "dif": "M", "tipo": "SEG", "q": "¿Por qué el motor de persiana no puede recibir a la vez la subida y la bajada?", "ok": "El condensador queda en cortocircuito y el motor se estropea", "d": ["Porque gira el doble de rápido", "Porque salta el final de carrera", "No pasa nada: se queda parado"], "j": "Por eso, si hay una orden automática además del pulsador, se pone un enclavamiento con un relé.", "img": "fig5.png", "cap": "Tema 1, figura 5: persiana mandada directamente con el pulsador doble.", "cat": ["esquemas", "persianas", "reles", "seguridad"]}, {"n": 16, "ans": "b", "tema": "T1", "t": "T1 · 4.3", "dif": "M", "tipo": "PULSA", "q": "¿Por qué se puede dejar la orden de subir puesta todo el tiempo que quieras?", "ok": "Porque el motor tiene finales de carrera internos y se para solo", "d": ["Porque el pulsador se suelta solo", "Porque el condensador corta la corriente", "No se puede: hay que soltar a tiempo"], "j": "Al llegar arriba o abajo, su final de carrera abre y el motor se para.", "img": "fig5.png", "cap": "Tema 1, figura 5: persiana mandada directamente con el pulsador doble.", "cat": ["esquemas", "persianas"]}, {"n": 17, "ans": "b", "tema": "T1", "t": "T1 · 4.4", "dif": "M", "tipo": "PULSA", "q": "Simulador de persiana: pulsas subir. ¿Por dónde llega la fase al motor?", "ok": "Por el 11-14 del pulsador y FC1, y entra al motor por A1A", "d": ["Por el 11-24 y FC2, y entra por A1B", "Por FC1 y FC2 unidos en un solo borne del motor", "Por el 11-14 y entra por A1A, sin pasar por ningún final de carrera"], "j": "La orden de subir pasa por FC1 y entra por A1A; la de bajar, por FC2 y A1B. Cuando el tornillo llega arriba, FC1 se abre y el motor se para.", "img": "fig6.png", "cap": "Tema 1, figura 6: simulador de persiana. Subir entra por FC1 y A1A; bajar, por FC2 y A1B. El PE no se usa.", "cat": ["esquemas", "persianas"]}, {"n": 18, "ans": "d", "tema": "T1", "t": "T1 · 4.4", "dif": "M", "tipo": "SIM", "q": "¿Qué bornes tiene el motor del simulador de persiana?", "ok": "A1A (subir), A1B (bajar), A2 (neutro) y PE, que no usamos", "d": ["Solo A1 y A2", "L, N y PE", "A1A y A1B, sin neutro"], "j": "Tiene los mismos 4 bornes que la persiana real. Las dos fases (subir y bajar) entran por separado: nunca se unen antes del motor.", "img": "fig6.png", "cap": "Tema 1, figura 6: simulador de persiana. Subir entra por FC1 y A1A; bajar, por FC2 y A1B. El PE no se usa.", "cat": ["esquemas", "persianas"]}, {"n": 19, "ans": "a", "tema": "T1", "t": "T1 · 4.5 (¿por qué?)", "dif": "M", "tipo": "SEG", "q": "La válvula de suelo radiante es normalmente cerrada. ¿Qué ventaja tiene?", "ok": "Si se va la luz o se corta un cable, se cierra: posición segura", "d": ["Consume menos al estar abierta", "Se abre más rápido", "Ninguna: es más cara"], "j": "Es seguridad positiva: ante un fallo, el sistema queda en la posición segura.", "img": null, "cap": "", "cat": ["seguridad", "valvulas"]}, {"n": 20, "ans": "c", "tema": "T1", "t": "T1 · Parte 1", "dif": "M", "tipo": "SIM", "q": "¿Qué letra lleva un timbre o una sirena en el esquema?", "ok": "H, como la lámpara de señalización", "d": ["E, como la bombilla", "S, como un sensor", "M, porque hace ruido con un motor"], "j": "Son avisos, igual que el piloto: se nombran con H. La bombilla de alumbrado es E y el enchufe TC.", "img": null, "cap": "", "cat": []}, {"n": 21, "ans": "d", "tema": "T1", "t": "T1 · 3.4 (ejemplo)", "dif": "M", "tipo": "APA", "q": "¿Qué aparato se usa en domótica en lugar de los conmutadores para encender una luz desde muchos sitios?", "ok": "Un telerruptor con pulsadores en paralelo", "d": ["Un relé auxiliar con pulsadores en serie", "Un contactor con interruptores", "Un detector de presencia"], "j": "El telerruptor cambia de estado con cada pulso. Da igual cuántos pulsadores: siempre son dos hilos.", "img": null, "cap": "", "cat": ["reles"]}, {"n": 22, "ans": "b", "tema": "P1", "t": "P1 · 1.3", "dif": "M", "tipo": "TAB", "q": "Ejercicio 1.3. La sala está fría. Completa la fila.", "ok": "KA1 = 1 · TC1 = 1 · H1 = 0", "d": ["KA1 = 0 · TC1 = 1 · H1 = 0", "KA1 = 1 · TC1 = 1 · H1 = 1", "KA1 = 1 · TC1 = 0 · H1 = 1"], "j": "Con frío el 11-12 del termostato activa KA1: su 11-14 se cierra (TC1) y su 21-22 se abre (H1 se apaga).", "img": "f13.png", "cap": "Ejercicio 1.3: el termostato S2 manda sobre la bobina del relé KA1. TC1 va por el 11-14 de KA1 y H1 por el 21-22.", "tab": {"h": ["S1", "Sala fría", "KA1", "TC1", "H1"], "r": [["1", "1", "?", "?", "?"]]}, "cat": ["e13", "esquemas", "reles", "sensores", "tablas"]}, {"n": 23, "ans": "c", "tema": "P1", "t": "P1 · 1.3", "dif": "D", "tipo": "TAB", "q": "Ejercicio 1.3. La sala ya está caliente. Completa la fila.", "ok": "KA1 = 0 · TC1 = 0 · H1 = 1", "d": ["KA1 = 0 · TC1 = 0 · H1 = 0", "KA1 = 1 · TC1 = 0 · H1 = 1", "KA1 = 0 · TC1 = 1 · H1 = 0"], "j": "KA1 en reposo: el 11-14 abierto (TC1 sin tensión) y el 21-22 cerrado: H1 se enciende cuando la calefacción se para.", "img": "f13.png", "cap": "Ejercicio 1.3: el termostato S2 manda sobre la bobina del relé KA1. TC1 va por el 11-14 de KA1 y H1 por el 21-22.", "tab": {"h": ["S1", "Sala fría", "KA1", "TC1", "H1"], "r": [["1", "0", "?", "?", "?"]]}, "cat": ["e13", "esquemas", "reles", "tablas"]}, {"n": 24, "ans": "a", "tema": "P1", "t": "P1 · 1.5", "dif": "M", "tipo": "TAB", "q": "Ejercicio 1.5. Hay alguien en la sala y hace frío. Completa la fila.", "ok": "KA1 = 1 · TC1 = 1 · H2 = 1 · H3 = 0", "d": ["KA1 = 1 · TC1 = 1 · H2 = 0 · H3 = 1", "KA1 = 0 · TC1 = 0 · H2 = 0 · H3 = 1", "KA1 = 1 · TC1 = 0 · H2 = 1 · H3 = 0"], "j": "Presencia Y frío: R2 y el 11-12 del termostato en serie activan KA1. Su 11-14 da tensión a TC1 y a H2 (en paralelo).", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "tab": {"h": ["S1", "S2 presencia", "S3 frío", "KA1", "TC1", "H2", "H3"], "r": [["1", "1", "1", "?", "?", "?", "?"]]}, "cat": ["e15", "esquemas", "reles", "sensores", "tablas"]}, {"n": 25, "ans": "b", "tema": "P1", "t": "P1 · 1.5", "dif": "M", "tipo": "TAB", "q": "Ejercicio 1.5. Hay alguien en la sala, pero ya hace calor. Completa la fila.", "ok": "KA1 = 0 · TC1 = 0 · H2 = 0 · H3 = 1", "d": ["KA1 = 1 · TC1 = 1 · H2 = 1 · H3 = 0", "KA1 = 0 · TC1 = 0 · H2 = 0 · H3 = 0", "KA1 = 0 · TC1 = 1 · H2 = 0 · H3 = 1"], "j": "H3 = presencia Y NO frío: el termostato pasa al 11-14 y enciende H3. KA1 se queda sin tensión.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "tab": {"h": ["S1", "S2 presencia", "S3 frío", "KA1", "TC1", "H2", "H3"], "r": [["1", "1", "0", "?", "?", "?", "?"]]}, "cat": ["e15", "esquemas", "reles", "sensores", "tablas"]}, {"n": 26, "ans": "a", "tema": "P1", "t": "P1 · 1.5", "dif": "D", "tipo": "TAB", "q": "Ejercicio 1.5. Hace frío, pero no hay nadie. Completa la fila.", "ok": "KA1 = 0 · TC1 = 0 · H2 = 0 · H3 = 0", "d": ["KA1 = 1 · TC1 = 1 · H2 = 1 · H3 = 0", "KA1 = 0 · TC1 = 0 · H2 = 0 · H3 = 1", "KA1 = 0 · TC1 = 1 · H2 = 0 · H3 = 0"], "j": "R2 del detector está abierto: no llega fase al termostato. Solo luce H1 (instalación con tensión).", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "tab": {"h": ["S1", "S2 presencia", "S3 frío", "KA1", "TC1", "H2", "H3"], "r": [["1", "0", "1", "?", "?", "?", "?"]]}, "cat": ["e15", "esquemas", "reles", "sensores", "tablas"]}, {"n": 27, "ans": "c", "tema": "P1", "t": "P1 · 1.5", "dif": "M", "tipo": "TAB", "q": "Ejercicio 1.5. ¿Qué lámpara se enciende en cuanto cierras S1, haya o no haya alguien?", "ok": "H1", "d": ["H2", "H3", "Ninguna: hace falta presencia"], "j": "H1 va directamente después de S1: indica que la instalación tiene tensión.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "tablas"]}, {"n": 28, "ans": "d", "tema": "P1", "t": "P1 · 1.5 (pista)", "dif": "D", "tipo": "TAB", "q": "Ejercicio 1.5. ¿Cuál es la condición de la bobina de KA1?", "ok": "S1 Y presencia Y frío: contactos en serie", "d": ["S1 O presencia O frío: contactos en paralelo", "Presencia Y NO frío", "S1 Y (presencia O frío)"], "j": "Las «Y» se montan con contactos en serie antes de la bobina.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "reles", "sensores", "tablas"]}, {"n": 29, "ans": "b", "tema": "P1", "t": "P1 · comprobación 1)", "dif": "M", "tipo": "MED", "q": "Antes de medir continuidad en el 1.5, ¿qué haces primero?", "ok": "Bajo el magnetotérmico y compruebo con V~ que marca 0 V", "d": ["Mido continuidad con la tensión puesta para ir más rápido", "Quito los cables del relé", "Pongo el polímetro en A"], "j": "Continuidad siempre sin tensión. Y se comprueba que de verdad no hay tensión antes de cambiar a Ω.", "img": null, "cap": "", "cat": ["e15", "medidas"]}, {"n": 30, "ans": "d", "tema": "P1", "t": "P1 · comprobación 1)", "dif": "M", "tipo": "MED", "q": "Sin tensión, en continuidad, mides entre Ⓒ y Ⓓ. ¿Qué tiene que marcar?", "ok": "No pita: cientos de Ω a unos kΩ", "d": ["Pita: 0 Ω", "OL: circuito abierto", "230 V"], "j": "Ⓒ y Ⓓ son el A1 y el A2 de la bobina de KA1. La bobina es un hilo muy largo y fino: tiene resistencia. Si marca OL, la bobina está cortada o el relé mal enchufado.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "medidas", "reles"]}, {"n": 31, "ans": "c", "tema": "P1", "t": "P1 · comprobación 1)", "dif": "M", "tipo": "MED", "q": "Sin tensión, en continuidad, mides entre Ⓔ y Ⓕ. ¿Qué pasa?", "ok": "No pita; empujando el relé a mano, pita", "d": ["Pita siempre", "No pita nunca", "Pita solo con la bobina conectada"], "j": "Ⓔ y Ⓕ son el 11 y el 14 de KA1. Es un NA: en reposo está abierto. Al empujar la chapa del relé a mano se cierra.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "medidas", "reles"]}, {"n": 32, "ans": "a", "tema": "P1", "t": "P1 · comprobación 1)", "dif": "M", "tipo": "MED", "q": "Sin tensión, en continuidad, mides entre Ⓐ y Ⓑ y giras la rueda de la consigna del termostato. ¿Qué tiene que pasar?", "ok": "Pita en una posición de la rueda y deja de pitar al girarla", "d": ["Pita siempre", "No pita nunca: el termostato necesita tensión", "Marca la temperatura de la sala"], "j": "Ⓐ y Ⓑ son el 11 y el 12 del termostato S3. El termostato es un contacto que mueve la temperatura. Al cambiar la consigna oyes el «clic» y el contacto cambia.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "medidas", "sensores"]}, {"n": 33, "ans": "b", "tema": "P1", "t": "P1 · comprobación 1)", "dif": "D", "tipo": "MED", "q": "Sin tensión, general cerrado y nada enchufado, mides entre fase y neutro y el polímetro pita (≈ 0 Ω). ¿Qué haces?", "ok": "No doy tensión: hay un cruce entre fase y neutro", "d": ["Doy tensión: es lo normal", "Doy tensión y miro si salta el magnetotérmico", "Cambio la pila del polímetro"], "j": "Entre fase y neutro solo puede haber la resistencia de las cargas. Si pita, hay un cortocircuito.", "img": null, "cap": "", "cat": ["medidas"]}, {"n": 34, "ans": "c", "tema": "P1", "t": "P1 · comprobación 1)", "dif": "M", "tipo": "MED", "q": "Sin tensión, mides en continuidad entre el borne de tierra de la TC y la tierra del cuadro. ¿Qué tiene que marcar?", "ok": "Pita", "d": ["No pita", "Unos kΩ", "230 V"], "j": "El conductor de protección tiene que llegar sin cortes desde el cuadro hasta el enchufe.", "img": null, "cap": "", "cat": ["medidas"]}, {"n": 35, "ans": "d", "tema": "P1", "t": "P1 · comprobación 2)", "dif": "M", "tipo": "MED", "q": "Con tensión, V~ y punta negra fija en N. Hay presencia y hace frío. Pones la roja en Ⓒ. ¿Qué lees?", "ok": "230 V, y KA1 entra", "d": ["0 V", "12 V", "115 V"], "j": "Ⓒ es el A1 de KA1. R2 y el 11-12 del termostato están cerrados: la fase llega hasta A1.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "medidas", "reles", "sensores"]}, {"n": 36, "ans": "a", "tema": "P1", "t": "P1 · comprobación 2)", "dif": "M", "tipo": "MED", "q": "Con tensión, V~ y punta negra en N. Pones la roja en Ⓓ. ¿Qué lees?", "ok": "0 V siempre", "d": ["230 V siempre", "230 V solo con KA1 activado", "12 V"], "j": "Ⓓ es el A2 de KA1. A2 está unido al neutro: entre A2 y N no hay tensión nunca.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "medidas", "reles"]}, {"n": 37, "ans": "d", "tema": "P1", "t": "P1 · comprobación 2)", "dif": "D", "tipo": "MED", "q": "Con tensión y V~ (negra en N). Hace frío, pero no hay nadie (ya pasó el tiempo del detector). Roja en Ⓑ. ¿Qué lees?", "ok": "0 V: la fase se para en el R2 del detector", "d": ["230 V: con frío el 11-12 está cerrado", "12 V", "230 V y KA1 entra"], "j": "Ⓑ es el 12 del termostato S3. El termostato va después del R2 del detector. Sin presencia no le llega fase.", "img": "f15.png", "cap": "Ejercicio 1.5: detector S2 (contacto R2), termostato S3 (12 frío, 14 calor) y relé KA1. H1 tensión, H2 calefacción, H3 presencia sin demanda de calor. Las letras marcan los puntos de medida.", "cat": ["e15", "esquemas", "medidas", "sensores"]}, {"n": 38, "ans": "a", "tema": "P1", "t": "P1 · comprobación 2)", "dif": "M", "tipo": "MED", "q": "Con tensión, mides en la toma de corriente entre fase y tierra, y entre neutro y tierra. ¿Qué lees?", "ok": "Fase-tierra 230 V y neutro-tierra ≈ 0 V", "d": ["Las dos 230 V", "Las dos 0 V", "Fase-tierra 0 V y neutro-tierra 230 V"], "j": "El neutro está unido a tierra en el transformador: entre neutro y tierra casi no hay tensión.", "img": null, "cap": "", "cat": ["medidas"]}, {"n": 39, "ans": "c", "tema": "P1", "t": "P1 · comprobación 2)", "dif": "M", "tipo": "MED", "q": "¿Cómo encuentras una avería midiendo tensión?", "ok": "Sigo la fase con la roja: la avería está entre el último punto con 230 V y el primero con 0 V", "d": ["Mido continuidad con la tensión puesta", "Mido entre dos puntos del mismo cable", "Cambio cables hasta que funcione"], "j": "Con la negra fija en N vas avanzando por los tornillos. Donde la fase desaparece, está el fallo.", "img": null, "cap": "", "cat": ["medidas"]}, {"n": 40, "ans": "b", "tema": "P1", "t": "P1 · comprobación 3)", "dif": "M", "tipo": "MED", "q": "Con la pinza amperimétrica, ¿cuánto consume un radiador de 1000 W a 230 V?", "ok": "Unos 4,3 A", "d": ["Unos 43 A", "Unos 0,43 A", "Unos 230 A"], "j": "I = P / V = 1000 / 230 ≈ 4,3 A. La bobina del relé, en cambio, solo unas decenas de mA.", "img": null, "cap": "", "cat": ["medidas", "reles"]}, {"n": 41, "ans": "a", "tema": "P1", "t": "P1 · comprobación 3)", "dif": "M", "tipo": "MED", "q": "Abrazas con la pinza la manguera entera de la toma (fase y neutro juntos). Marca 0 A con el radiador funcionando. ¿Por qué?", "ok": "La corriente que va por la fase vuelve por el neutro y se anulan: hay que abrazar un solo cable", "d": ["El radiador no consume", "La pinza solo mide continua", "La pinza está en V"], "j": "Con la pinza se abraza siempre un solo conductor, nunca la manguera.", "img": null, "cap": "", "cat": ["medidas"]}, {"n": 42, "ans": "c", "tema": "P1", "t": "P1 · si algo no marca", "dif": "D", "tipo": "AVE", "q": "Un cable no pita de tornillo a tornillo y, al moverlo, el pitido va y viene. ¿Qué le pasa?", "ok": "Está pisado: el tornillo aprieta el aislante y no el cobre", "d": ["Está bien: es normal", "Es un cable de 12 V", "Es un cruce entre fase y neutro"], "j": "Mete el cobre entero (sin aislante) y aprieta. Tira suave del cable para comprobarlo.", "img": null, "cap": "", "cat": ["averias"]}, {"n": 43, "ans": "b", "tema": "P1", "t": "P1 · 1.1", "dif": "D", "tipo": "AVE", "q": "Ejercicio 1.1. S1 cerrado, hace frío y el radiador no calienta. Con V~ lees 230 V en Ⓐ y 0 V en Ⓑ. ¿Dónde está la avería?", "ok": "En el cable que va de Ⓐ a Ⓑ", "d": ["En el termostato", "En el interruptor S1", "En el magnetotérmico Q1"], "j": "Ⓐ es el 12 del termostato S2 y Ⓑ, el borne L de la toma TC1. Hasta el 12 llega la fase; en la L de la toma ya no. El fallo está en ese tramo: cable cortado o pisado.", "img": "f11.png", "cap": "Ejercicio 1.1: el termostato S2 da tensión a la toma TC1 (calefacción). S1 es el interruptor general. En el esquema, 11-12 se cierra con frío y 11-14 con calor. Las letras marcan los puntos de medida.", "cat": ["averias", "e11", "esquemas", "sensores"]}, {"n": 44, "ans": "d", "tema": "P1", "t": "P1 · si algo no marca", "dif": "D", "tipo": "AVE", "q": "Ejercicio 1.3. La calefacción funciona con calor y se para con frío (al revés). ¿Qué es lo más probable?", "ok": "Un borne equivocado: el termostato está cableado al 14 en vez de al 12", "d": ["Un cable pisado", "El magnetotérmico bajado", "La bobina del relé cortada"], "j": "Cuando el contacto hace lo contrario de lo esperado, se ha usado el borne NA en lugar del NC (o al revés).", "img": "f13.png", "cap": "Ejercicio 1.3: el termostato S2 manda sobre la bobina del relé KA1. TC1 va por el 11-14 de KA1 y H1 por el 21-22.", "cat": ["averias", "e13", "esquemas", "sensores"]}, {"n": 45, "ans": "d", "tema": "P1", "t": "P1 · 1.4 (¡OJO!)", "dif": "M", "tipo": "PULSA", "q": "En el 1.4 las lámparas cuelgan directamente de la salida del detector. ¿Podrías poner así un radiador de 2000 W?", "ok": "No: unos 9 A es demasiado para el contacto; necesita relé o contactor", "d": ["Sí: el detector aguanta cualquier carga", "Sí, si se pone LUX en la luna", "No, porque los radiadores van a 12 V"], "j": "Sin preactuador, toda la corriente pasa por el contacto del detector. Tres bombillas sí; un radiador grande, no.", "img": "f14.png", "cap": "Ejercicio 1.4: detector de presencia S1 (L, N y salida LS) con tres lámparas E1, E2 y E3. Las letras marcan los puntos de medida.", "cat": ["e14", "esquemas", "reles", "sensores"]}, {"n": 46, "ans": "a", "tema": "P1", "t": "P1 · 1.4", "dif": "M", "tipo": "MED", "q": "Ejercicio 1.4, con tensión y V~ (negra en N). Detecta presencia. Roja en Ⓐ. ¿Qué lees?", "ok": "230 V", "d": ["12 V", "0 V: LS es un contacto seco", "115 V"], "j": "Ⓐ es la salida LS del detector S1. LS da fase directamente a las lámparas; por eso van entre LS y N.", "img": "f14.png", "cap": "Ejercicio 1.4: detector de presencia S1 (L, N y salida LS) con tres lámparas E1, E2 y E3. Las letras marcan los puntos de medida.", "cat": ["e14", "esquemas", "medidas", "sensores"]}, {"n": 47, "ans": "c", "tema": "P2", "t": "P2 · 2.1 tabla", "dif": "M", "tipo": "TAB", "q": "Ejercicio 2.1. Es de día y nadie toca el pulsador. Completa la fila.", "ok": "KA1 = 0 · M1▲ = 1 · M1▼ = 0", "d": ["KA1 = 0 · M1▲ = 0 · M1▼ = 0", "KA1 = 1 · M1▲ = 1 · M1▼ = 0", "KA1 = 0 · M1▲ = 0 · M1▼ = 1"], "j": "De día el 11-12 de S2 da fase directamente a la subida (A1A) y a H2: la persiana sube sola.", "img": "f21.png", "cap": "Ejercicio 2.1: persiana con permiso nocturno. S2 crepuscular: 11-12 cerrado de día, 11-14 cerrado de noche. KA1 evita subir y bajar a la vez. Las letras marcan los puntos de medida.", "tab": {"h": ["S2 noche", "S1 ▲", "S1 ▼", "KA1", "M1 ▲", "M1 ▼"], "r": [["0", "0", "0", "?", "?", "?"]]}, "cat": ["e21", "esquemas", "persianas", "reles", "tablas"]}, {"n": 48, "ans": "b", "tema": "P2", "t": "P2 · 2.1 tabla", "dif": "M", "tipo": "TAB", "q": "Ejercicio 2.1. Es de día y alguien pulsa bajar (▼). Completa la fila.", "ok": "KA1 = 0 · M1▲ = 1 · M1▼ = 0", "d": ["KA1 = 1 · M1▲ = const TEMAS = {T1:"Tema 1 · Sensores y actuadores",P1:"Práctica 1",P2:"Práctica 2"};
const TIPO = {MED:"Medidas con el polímetro",TAB:"Tablas de funcionamiento",AVE:"Búsqueda de averías",PULSA:"Qué pasa",SIM:"Símbolos y bornes",APA:"Aparatos",SEG:"Seguridad"};
const CATS = [["Tipo de pregunta", [["tablas", "Tablas de funcionamiento"], ["medidas", "Medidas con el polímetro"], ["averias", "Búsqueda de averías"], ["esquemas", "Preguntas con esquema"], ["seguridad", "Seguridad"]]], ["Aparatos", [["sensores", "Sensores"], ["reles", "Relés y su base"], ["persianas", "Persianas y simulador"], ["valvulas", "Válvulas y electroválvulas"]]], ["Ejercicios de las prácticas", [["e11", "1.1 Termostato"], ["e13", "1.3 Calefacción con relé"], ["e14", "1.4 Detector de presencia"], ["e15", "1.5 Caldeo con presencia"], ["e21", "2.1 Persiana nocturna"], ["e22", "2.2 Riego"], ["e23", "2.3 Alarma con memoria"], ["e24", "2.4 Lavadero"]]]];
const app = document.getElementById('app');

/* ---------- tema claro/oscuro ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('tema'); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('tema', root.dataset.theme); } catch(e) {}
};

/* ---------- zoom de esquemas ---------- */
const zoom = document.getElementById('zoom');
zoom.onclick = () => zoom.style.display = 'none';
function openZoom(src){ zoom.querySelector('img').src = src; zoom.style.display = 'flex'; }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (zoom.style.display === 'flex') { zoom.style.display = 'none'; return; }
    location.href = 'index.html#tests'; return;
  }
  if (e.key === 'Backspace' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    location.href = 'index.html#tests'; return;
  }
  if (state.screen !== 'q') return;
  if (e.key === 'ArrowLeft') { go(state.i - 1); e.preventDefault(); return; }
  if (e.key === 'ArrowRight') { go(state.i + 1); e.preventDefault(); return; }
  if (e.key === 'PageDown') { go(Math.min(state.list.length - 1, state.i + 10)); e.preventDefault(); return; }
  if (e.key === 'PageUp') { go(Math.max(0, state.i - 10)); e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  const idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (!state.answered && idx >= 0) { answer(idx); e.preventDefault(); }
  else if (state.answered && (e.key === 'Enter' || e.key === ' ')) { next(); e.preventDefault(); }
});

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pts = s => esc(s).replace(/[\u24B6-\u24CF]/g, c => `<b class="pt">${String.fromCharCode(c.charCodeAt(0) - 0x24B6 + 65)}</b>`);

let state = { screen: 'start' };

/* ---------- inicio ---------- */
function start(){
  state = { screen: 'start' }; drawMap();
  const cnt = t => DATA.filter(q => q.tema === t).length;
  const N = DATA.length, B = 25, blocks = [];
  for (let a = 1; a <= N; a += B) blocks.push([a, Math.min(a + B - 1, N)]);
  let mode = 'orden';
  try { mode = localStorage.getItem('testModoDom') || 'orden'; } catch(e) {}
  app.innerHTML = `
  <h1>Test Bloque 1 · <span>Domótica</span></h1>
  <p class="sub">${N} preguntas del Tema 1 y las Prácticas 1 y 2: sobre todo <b>medidas con el polímetro</b>, <b>tablas de funcionamiento</b> y <b>averías</b>. Recuerda: <b>borne = tornillo</b> del aparato.</p>
  <div class="card">
    <fieldset><legend>¿Cómo quieres hacerlo?</legend><div class="chips">
      <label class="chip"><input type="radio" name="modo" value="orden" ${mode==='orden'?'checked':''}><span>En orden</span></label>
      <label class="chip"><input type="radio" name="modo" value="azar" ${mode==='azar'?'checked':''}><span>Al azar</span></label>
      <label class="chip"><input type="radio" name="modo" value="cat" ${mode==='cat'?'checked':''}><span>Por tema</span></label>
    </div></fieldset>
    <div id="m-orden">
      <fieldset><legend>Qué preguntas</legend><div class="chips">
        ${blocks.map(([a,b],i) => `<label class="chip"><input type="radio" name="bloque" value="${a}-${b}" ${i===0?'checked':''}><span>${a} a ${b}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="bloque" value="1-${N}"><span>Todas (1 a ${N})</span></label>
      </div></fieldset>
    </div>
    <div id="m-azar">
      <fieldset><legend>Tema y prácticas</legend><div class="chips">
        ${Object.keys(TEMAS).filter(t => cnt(t) > 0).map(t => `<label class="chip"><input type="checkbox" name="tema" value="${t}" checked><span>${TEMAS[t]} <span class="cnt">(${cnt(t)})</span></span></label>`).join('')}
      </div></fieldset>
      <fieldset><legend>Tipo de pregunta</legend><div class="chips">
        ${Object.keys(TIPO).filter(t => DATA.some(q => q.tipo === t)).map(t => `<label class="chip"><input type="checkbox" name="tipo" value="${t}" checked><span>${TIPO[t]} <span class="cnt">(${DATA.filter(q => q.tipo === t).length})</span></span></label>`).join('')}
      </div></fieldset>
      <fieldset><legend>Dificultad</legend><div class="chips">
        <label class="chip"><input type="radio" name="dif" value="all" checked><span>Todas</span></label>
        <label class="chip"><input type="radio" name="dif" value="M"><span>Medias</span></label>
        <label class="chip"><input type="radio" name="dif" value="D"><span>Difíciles</span></label>
      </div></fieldset>
      <fieldset><legend>Número de preguntas</legend><div class="chips">
        ${[10,20,40].map((n,i) => `<label class="chip"><input type="radio" name="num" value="${n}" ${i===1?'checked':''}><span>${n}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="num" value="0"><span>Todas</span></label>
      </div></fieldset>
    </div>
    <div id="m-cat">
      <p class="cnt" style="margin:0 0 8px">Elige uno o varios temas: saldrán preguntas al azar solo de lo que marques.</p>
      <div class="cbtns"><button type="button" id="call">Marcar todos</button><button type="button" id="cnone">Quitar todos</button></div>
      ${CATS.map(([g, items]) => `<div class="cgrp"><h3>${g}</h3><div class="chips">
        ${items.filter(([k]) => DATA.some(q => q.cat.includes(k))).map(([k, l]) => `<label class="chip"><input type="checkbox" name="cat" value="${k}"><span>${l} <span class="cnt">(${DATA.filter(q => q.cat.includes(k)).length})</span></span></label>`).join('')}
      </div></div>`).join('')}
      <fieldset><legend>Número de preguntas</legend><div class="chips">
        ${[10,20].map((n,i) => `<label class="chip"><input type="radio" name="numc" value="${n}" ${i===0?'checked':''}><span>${n}</span></label>`).join('')}
        <label class="chip"><input type="radio" name="numc" value="0"><span>Todas</span></label>
      </div></fieldset>
    </div>
    <p id="avail" class="cnt"></p>
    <button class="go" id="go">Empezar</button>
  </div>
  <div class="box"><span class="lbl">CÓMO FUNCIONA</span>
    Elige una respuesta tocándola (o con las teclas A, B, C, D). Aciertes o no, verás <b>por qué</b> es esa la respuesta.
    Toca un esquema para verlo en grande. Si sales a medias, el test se queda guardado en este móvil u ordenador y puedes seguirlo otro día.<br>
    <b>En orden</b>: las preguntas salen siempre con el mismo número y las respuestas en el mismo orden, como en el test en papel.
    <b>Al azar</b>: cambian las preguntas y el orden de las respuestas cada vez.
    <b>Por tema</b>: practica solo lo que quieras (por ejemplo, tablas de funcionamiento o medidas).</div>`;
  const upd = () => {
    const m = app.querySelector('input[name=modo]:checked').value;
    document.getElementById('m-orden').style.display = m === 'orden' ? '' : 'none';
    document.getElementById('m-azar').style.display = m === 'azar' ? '' : 'none';
    document.getElementById('m-cat').style.display = m === 'cat' ? '' : 'none';
    try { localStorage.setItem('testModoDom', m); } catch(e) {}
    const pool = pick();
    document.getElementById('avail').textContent = m === 'orden'
      ? `${pool.length} preguntas, de la ${pool[0].n} a la ${pool[pool.length-1].n}.`
      : m === 'cat'
      ? (catPool().length ? `Hay ${catPool().length} preguntas de estos temas; te saldrán ${pool.length}.` : 'Marca al menos un tema.')
      : `Hay ${filtered().length} preguntas con estos filtros.`;
    document.getElementById('go').disabled = pool.length === 0;
  };
  app.querySelectorAll('input').forEach(i => i.onchange = upd);
  document.getElementById('call').onclick = () => { app.querySelectorAll('input[name=cat]').forEach(i => i.checked = true); upd(); };
  document.getElementById('cnone').onclick = () => { app.querySelectorAll('input[name=cat]').forEach(i => i.checked = false); upd(); };
  upd();
  offerProg();
  document.getElementById('go').onclick = () => {
    const pool = pick(), ord = state.mode === 'orden';
    state = { screen: 'q', mode: ord ? 'orden' : 'azar', list: pool.map(q => item(q, ord)), i: 0, ok: 0, answered: false };
    show();
  };
}
function item(q, ord){ return { q, order: ord ? fixedOrder(q) : shuffle([0,1,2,3]), pick: null }; }
function fixedOrder(q){ const a = 'abcd'.indexOf(q.ans); let d = 1; return [0,1,2,3].map(k => k === a ? 0 : d++); }
function pick(){
  const m = app.querySelector('input[name=modo]:checked').value;
  state.mode = m;
  if (m === 'orden') {
    const [a, b] = app.querySelector('input[name=bloque]:checked').value.split('-').map(Number);
    return DATA.filter(q => q.n >= a && q.n <= b);
  }
  if (m === 'cat') {
    const nc = +app.querySelector('input[name=numc]:checked').value, pc = shuffle(catPool());
    return nc ? pc.slice(0, nc) : pc;
  }
  const n = +app.querySelector('input[name=num]:checked').value;
  let pool = shuffle(filtered());
  return n ? pool.slice(0, n) : pool;
}
function catPool(){
  const cs = [...app.querySelectorAll('input[name=cat]:checked')].map(i => i.value);
  return DATA.filter(q => q.cat.some(c => cs.includes(c)));
}
function filtered(){
  const temas = [...app.querySelectorAll('input[name=tema]:checked')].map(i => i.value);
  const dif = app.querySelector('input[name=dif]:checked').value;
  const tipos = [...app.querySelectorAll('input[name=tipo]:checked')].map(i => i.value);
  return DATA.filter(q => temas.includes(q.tema) && tipos.includes(q.tipo) && (dif === 'all' || q.dif === dif));
}

/* ---------- test a medias: se guarda en este navegador para seguirlo otro día ---------- */
const PKEY = 'testProg:' + (location.pathname.split('/').pop() || 'test');
function saveProg(){
  try {
    if (state.screen !== 'q' || !state.list.some(x => x.pick !== null)) return;
    localStorage.setItem(PKEY, JSON.stringify({ v: 1, t: Date.now(), mode: state.mode, i: state.i, list: state.list.map(x => [x.q.n, x.order, x.pick]) }));
  } catch(e) {}
}
function clearProg(){ try { localStorage.removeItem(PKEY); } catch(e) {} }
function loadProg(){
  try {
    const p = JSON.parse(localStorage.getItem(PKEY) || 'null');
    if (!p || p.v !== 1 || !Array.isArray(p.list) || !p.list.length) return null;
    const byn = {}; DATA.forEach(q => byn[q.n] = q);
    const list = p.list.map(a => {
      const q = byn[a[0]], o = a[1], k = a[2];
      if (!q || !Array.isArray(o) || o.slice().sort().join('') !== '0123') return null;
      return { q, order: o, pick: (k === 0 || k === 1 || k === 2 || k === 3) ? k : null };
    });
    if (list.some(x => !x)) return null;
    const done = list.filter(x => x.pick !== null).length;
    if (!done || done === list.length) return null;
    return { mode: p.mode === 'orden' ? 'orden' : 'azar', list, done, i: Math.max(0, Math.min(list.length - 1, p.i | 0)),
             ok: list.filter(x => x.pick !== null && x.order[x.pick] === 0).length };
  } catch(e) { return null; }
}
function offerProg(){
  const p = loadProg(); if (!p) return;
  const d = document.createElement('div'); d.className = 'card resume'; d.id = 'resume';
  d.innerHTML = `<b>Tienes un test a medias.</b> Llevas ${p.done} de ${p.list.length} preguntas contestadas y ${p.ok} ${p.ok === 1 ? 'acierto' : 'aciertos'}.
    <div class="nav" style="justify-content:flex-start;margin-top:10px"><button class="go" id="cont">Seguir donde lo dejé</button><button class="go ghost" id="drop">Borrarlo</button></div>`;
  app.insertBefore(d, app.querySelector('.card'));
  document.getElementById('cont').onclick = () => {
    const first = p.list.findIndex(x => x.pick === null);
    state = { screen: 'q', mode: p.mode, list: p.list, i: first >= 0 ? first : p.i, ok: p.ok, answered: false };
    show();
  };
  document.getElementById('drop').onclick = () => { clearProg(); d.remove(); };
}

/* ---------- pregunta ---------- */
function opts(q){ return [q.ok, ...q.d]; } // índice 0 = correcta
function show(){
  const it = state.list[state.i], q = it.q, n = state.list.length;
  state.answered = it.pick !== null;
  const all = opts(q);
  app.innerHTML = `
  <div class="meta"><span class="tag nq">Nº ${q.n}</span><span>${state.i+1} de ${n}</span>
    <span class="tag">${q.tema === 'T1' ? 'Tema 1' : TEMAS[q.tema]}</span><span class="tag">${TIPO[q.tipo]}</span>
    <span class="tag ${q.dif==='D'?'d':''}">${q.dif==='D'?'Difícil':'Media'}</span>
    <span class="score">Aciertos: ${state.ok}</span></div>
  <div class="bar"><i style="width:${state.list.filter(x => x.pick !== null).length/n*100}%"></i></div>
  <div class="jump">
    <button class="go ghost" id="prev" ${state.i === 0 ? 'disabled' : ''} aria-label="Pregunta anterior">←<span class="tx"> Anterior</span></button>
    <button class="go ghost" id="m10" ${state.i === 0 ? 'disabled' : ''} aria-label="Retroceder 10 preguntas">−10</button>
    <button class="go ghost" id="tg" aria-expanded="false" aria-controls="qg">Ir a la pregunta… ▾</button>
    <button class="go ghost" id="p10" ${state.i === n - 1 ? 'disabled' : ''} aria-label="Avanzar 10 preguntas">+10</button>
    <button class="go ghost" id="nx" ${state.i === n - 1 ? 'disabled' : ''} aria-label="Pregunta siguiente"><span class="tx">Siguiente </span>→</button>
    <div class="qgrid" id="qg" hidden>
      ${state.list.map((x,k) => `<button data-j="${k}" class="${x.pick === null ? '' : (x.order[x.pick] === 0 ? 'ok' : 'ko')}${k === state.i ? ' cur' : ''}">${lab(x,k)}</button>`).join('')}
      <p class="leg">Verde: acertada · Rojo: fallada · Gris: sin contestar. Con el teclado: flechas ← → (de una en una) y AvPág / RePág (de 10 en 10).</p>
      <button class="go fin" id="fin">Terminar y ver resultado</button>
    </div>
  </div>
  <div class="card">
    ${q.img ? `<figure><img src="${IMGS[q.img]}" alt="Esquema: ${esc(q.cap)}" id="fig"><figcaption>${esc(q.cap)}</figcaption></figure>` : ''}
    <div class="qtext">${pts(q.q)}</div>
    ${q.tab ? tabla(q.tab) : ''}
    <div class="opts">${it.order.map((o,k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${pts(all[o])}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
  const f = document.getElementById('fig'); if (f) f.onclick = () => openZoom(f.src);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  document.getElementById('prev').onclick = () => go(state.i - 1);
  document.getElementById('nx').onclick = () => go(state.i + 1);
  document.getElementById('m10').onclick = () => go(Math.max(0, state.i - 10));
  document.getElementById('p10').onclick = () => go(Math.min(state.list.length - 1, state.i + 10));
  document.getElementById('fin').onclick = result;
  const tg = document.getElementById('tg'), qg = document.getElementById('qg');
  tg.onclick = () => { qg.hidden = !qg.hidden; tg.setAttribute('aria-expanded', !qg.hidden); };
  app.querySelectorAll('.qgrid button[data-j]').forEach(b => b.onclick = () => go(+b.dataset.j));
  if (state.answered) paint();
  drawMap();
  window.scrollTo({ top: 0 });
}
function tabla(t){
  return `<div class="tw"><table class="tt"><thead><tr>${t.h.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.r.map(r => `<tr>${r.map(c => c === '?' ? '<td class="qq">?</td>' : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="hint" style="margin-top:0">1 = sí (cerrado, pulsado, activado, encendido) · 0 = no.</p>`;
}
function answer(k){
  if (state.answered) return;
  const it = state.list[state.i];
  it.pick = k; state.answered = true;
  if (it.order[k] === 0) state.ok++;
  paint(); saveProg();
  const nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
}
function paint(){
  const it = state.list[state.i], q = it.q;
  const good = it.order[it.pick] === 0;
  app.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.k; b.disabled = true;
    if (it.order[k] === 0) b.classList.add('right');
    else if (k === it.pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const okLetter = 'ABCD'[it.order.indexOf(0)];
  const last = state.i === state.list.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="verdict ${good?'ok':'ko'}">${good ? '✔ ¡Correcto!' : `✘ No es correcta. La buena es la opción ${okLetter}.`}</div>
    <div class="box why"><span class="lbl">¿POR QUÉ?</span>${pts(q.j)}</div>
    <div class="hint">Lo tienes en: ${esc(q.t)}</div>
    <div class="nav"><button class="go" id="next">${last ? 'Ver resultado' : 'Siguiente →'}</button></div>`;
  document.getElementById('next').onclick = next;
  document.querySelector('.score').textContent = `Aciertos: ${state.ok}`;
  drawMap();
}
function lab(x, k){ return state.mode === 'orden' ? x.q.n : k + 1; }
function go(k){ if (k < 0 || k >= state.list.length) return; state.i = k; show(); saveProg(); }
function next(){
  if (state.i < state.list.length - 1) { state.i++; show(); saveProg(); } else result();
}

/* ---------- resultado ---------- */
function result(){
  state.screen = 'end'; drawMap();
  if (state.list.every(it => it.pick !== null)) clearProg();
  const n = state.list.length, ans = state.list.filter(it => it.pick !== null), blank = state.list.filter(it => it.pick === null);
  const nota = ans.length ? state.ok / ans.length * 10 : 0;
  const fails = ans.filter(it => it.order[it.pick] !== 0);
  const msg = nota >= 9 ? '¡Muy bien! Lo dominas.' : nota >= 7 ? 'Bien. Repasa los fallos.' : nota >= 5 ? 'Aprobado justo: repasa los fallos con los apuntes.' : 'Toca repasar. Mira los fallos y vuelve a intentarlo.';
  app.innerHTML = `
  <h1>Resultado</h1>
  <div class="card" style="text-align:center">
    <p class="big">${state.ok} / ${ans.length}</p>
    <p style="margin:4px 0 0">Nota: <b>${nota.toFixed(1).replace('.',',')}</b> · ${msg}</p>
    ${blank.length ? `<p class="cnt" style="margin:6px 0 0">Has contestado ${ans.length} de ${n}. Las ${blank.length} sin contestar no cuentan en la nota.</p>` : ''}
  </div>
  ${fails.length ? `<div class="card"><h2 style="margin:0 0 4px;font-size:20px">Tus fallos (${fails.length})</h2>
    ${fails.map(it => { const a = opts(it.q); return `<div class="review">
      <div class="rq">Nº ${it.q.n}. ${pts(it.q.q)}${it.q.img ? ` <span class="cnt">(${esc(it.q.cap.split('. ')[0])})</span>` : ''}</div>
      <div class="ry">Tu respuesta: ${pts(a[it.order[it.pick]])}</div>
      <div class="ra">Correcta: ${pts(a[0])}</div>
      <div class="cnt">${pts(it.q.j)} · ${esc(it.q.t)}</div></div>`; }).join('')}
  </div>` : ''}
  <div class="nav" style="justify-content:center">
    ${fails.length ? '<button class="go ghost" id="redo">Repetir solo los fallos</button>' : ''}
    ${blank.length ? '<button class="go ghost" id="blank">Hacer las que faltan</button>' : ''}
    <button class="go" id="again">Nuevo test</button>
  </div>`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('redo');
  if (r) r.onclick = () => { state = { screen: 'q', mode: state.mode, list: (state.mode === 'orden' ? fails : shuffle(fails)).map(it => item(it.q, state.mode === 'orden')), i: 0, ok: 0, answered: false }; show(); };
  const bl = document.getElementById('blank');
  if (bl) bl.onclick = () => { const m = state.mode; state = { screen: 'q', mode: m, list: blank.map(it => item(it.q, m === 'orden')), i: 0, ok: 0, answered: false }; show(); };
  window.scrollTo({ top: 0 });
}

/* ---------- mapa de preguntas y marcador (a los lados; en el móvil, barra de abajo) ---------- */
const mapL = document.createElement('aside'), mapR = document.createElement('aside'), qbar = document.createElement('div'), qsheet = document.createElement('div');
mapL.className = 'qmap l'; mapR.className = 'qmap r'; qbar.className = 'qbar'; qsheet.className = 'qsheet'; qsheet.hidden = true;
mapL.setAttribute('aria-label', 'Mapa de preguntas'); mapR.setAttribute('aria-label', 'Cómo vas');
document.body.append(mapL, mapR, qsheet, qbar);
qbar.onclick = () => { qsheet.hidden = !qsheet.hidden; };
function qcls(x, k){ return (x.pick === null ? '' : (x.order[x.pick] === 0 ? 'ok' : 'ko')) + (k === state.i ? ' cur' : ''); }
function gridHTML(){
  const L = state.list; let h = '';
  for (let a = 0; a < L.length; a += 10) {
    const b = Math.min(a + 9, L.length - 1);
    h += `<div class="qblk"><span>${lab(L[a], a)} a ${lab(L[b], b)}</span><div class="g">` + L.slice(a, a + 10).map((x, j) => `<button data-j="${a + j}" class="${qcls(x, a + j)}" aria-label="Pregunta ${lab(x, a + j)}">${lab(x, a + j)}</button>`).join('') + '</div></div>';
  }
  return h;
}
function drawMap(){
  const on = state.screen === 'q'; document.body.classList.toggle('inq', on);
  if (!on) { qsheet.hidden = true; return; }
  const L = state.list, n = L.length, ans = L.filter(x => x.pick !== null), ok = ans.filter(x => x.order[x.pick] === 0).length, ko = ans.length - ok;
  const nota = ans.length ? (ok / ans.length * 10).toFixed(1).replace('.', ',') : '–';
  mapL.innerHTML = '<h2>Preguntas</h2>' + gridHTML() + '<p class="leg"><i class="ok"></i>acertada <i class="ko"></i>fallada <i></i>sin contestar</p>';
  mapR.innerHTML = `<h2>Cómo vas</h2><div class="sc ok"><b>${ok}</b>aciertos</div><div class="sc ko"><b>${ko}</b>fallos</div><div class="sc"><b>${n - ans.length}</b>sin contestar</div><div class="sc nota">Nota: <b>${nota}</b><small>solo cuenta lo contestado</small></div><button class="go fin" id="finR">Terminar y ver resultado</button>`;
  qbar.innerHTML = `<div class="segs">${L.map((x, k) => `<i class="${qcls(x, k)}"></i>`).join('')}</div><div class="tx">${state.i + 1} de ${n} · <span class="ok">✔ ${ok}</span> · <span class="ko">✘ ${ko}</span><span class="more">▴ mapa de preguntas</span></div>`;
  qsheet.innerHTML = gridHTML() + '<button class="go fin" id="finS">Terminar y ver resultado</button>';
  mapL.querySelectorAll('button[data-j]').forEach(b => b.onclick = () => go(+b.dataset.j));
  qsheet.querySelectorAll('button[data-j]').forEach(b => b.onclick = () => { qsheet.hidden = true; go(+b.dataset.j); });
  document.getElementById('finR').onclick = result;
  document.getElementById('finS').onclick = () => { qsheet.hidden = true; result(); };
  const c = mapL.querySelector('.cur'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest' });
}
start();
</script>
</body>
